name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-build:
    name: Syntax and package (macOS 14, Python ${{ matrix.python }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Set up the pinned native-helper toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Install locked development environment
        run: uv sync --locked

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q maniml tests

      - name: Run display-independent hardening tests
        # YAML folding keeps the test list readable while executing one command.
        run: >-
          uv run --locked python -m unittest
          tests.test_ce_extractor
          tests.test_web_security
          tests.test_web_server_events
          tests.test_web_cli
          tests.test_app_relay
          tests.test_agent
          tests.test_analytic_geometry
          tests.test_analytic_scene
          tests.test_performance
          tests.test_shader_uniforms
          tests.test_renderer_quality_fixtures
          tests.test_viewer_exports
          tests.test_earcut_probe
          tests.test_triangle_scene
          tests.test_renderer_motion
          tests.test_static_assets
          tests.test_webgpu_commands
          tests.test_generated_webgpu_commands
          tests.test_generated_wgpu
          tests.test_generated_geometry
          tests.test_generated_scene
          tests.test_fill_paint
          tests.test_texture_retention
          tests.test_border_geometry
          tests.test_gpu_border_geometry
          tests.test_gpu_border_audit
          tests.test_border_compute
          tests.test_gpu_border_quality
          tests.test_render_cache_revision
          tests.test_fill_bounds
          tests.test_geometry_cache
          tests.test_earclip_triangulation
          tests.test_triangle_geometry
          tests.test_renderer_fixtures
          tests.test_hosted_site
          tests.test_safe_text_cache
          tests.test_headless_import
          tests.test_app_protocol
          tests.test_export_publication
          tests.test_external_processes
          tests.test_remote_assets
          tests.test_scene_lifecycle
          tests.test_animations
          tests.test_creation
          tests.test_native_camera
          tests.test_native_gl_camera
          tests.test_renderer_ordering
          tests.test_renderer_selection
          tests.test_winding_texture_retention
          tests.test_coordinate_systems
          tests.test_vectorized_mobject
          tests.test_present_bundle
          tests.test_rail_sim

      - name: Audit locked dependencies
        if: matrix.python == '3.14'
        run: uv audit --locked

      - name: Build and inspect distributions
        run: |
          uv build
          uv run --locked python -m twine check dist/*
          uv run --locked python tests/check_wheel.py --load-native

      - name: Store release-candidate distributions
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maniml-distributions
          path: dist/
          if-no-files-found: error

  integration:
    name: Integration (macOS 14, Python ${{ matrix.python }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Set up the pinned native-helper toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Install maniml
        run: uv sync --locked --no-dev

      - name: Run logic and headless integration tests
        run: >-
          uv run --locked --no-dev python -m unittest
          tests.test_source_map
          tests.test_ce_conformance
          tests.test_checkpoint_reload
          tests.test_checkpoint_ledger
          tests.test_modes
          tests.test_export
          tests.test_app
          tests.test_web_viewer
