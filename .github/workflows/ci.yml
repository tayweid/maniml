name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-build:
    name: Syntax and package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2025]
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q maniml tests

      - name: Run display-independent hardening tests
        run: |
          uv run --locked python -m unittest \
            tests.test_ce_extractor \
            tests.test_web_security \
            tests.test_safe_text_cache \
            tests.test_headless_import \
            tests.test_app_protocol \
            tests.test_external_processes

      - name: Audit locked dependencies
        if: matrix.os == 'ubuntu-22.04' && matrix.python == '3.14'
        run: uv audit --locked

      - name: Build and inspect distributions
        run: |
          uv build
          uv run --locked python -m twine check dist/*
          uv run --locked python tests/check_wheel.py

      - name: Store release-candidate distributions
        if: matrix.os == 'ubuntu-22.04' && matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maniml-distributions
          path: dist/
          if-no-files-found: error

  integration:
    name: Integration (Ubuntu, Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg libegl1 libgl1-mesa-dev libgles2 libpango-1.0-0 xauth xvfb

      - name: Install maniml
        run: uv sync --locked --no-dev

      - name: Run logic and headless-GL integration tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a uv run --locked --no-dev python -m unittest \
            tests.test_source_map \
            tests.test_ce_conformance \
            tests.test_checkpoint_reload \
            tests.test_modes \
            tests.test_export \
            tests.test_app \
            tests.test_web_viewer
