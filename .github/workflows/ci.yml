name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax-build:
    name: Syntax and package (macOS 14, Python ${{ matrix.python }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked

      - name: Compile Python sources
        run: uv run --locked python -m compileall -q maniml tests

      - name: Run display-independent hardening tests
        # YAML folding keeps the test list readable while executing one command.
        run: >-
          uv run --locked python -m unittest
          tests.test_ce_extractor
          tests.test_web_security
          tests.test_pwa
          tests.test_safe_text_cache
          tests.test_headless_import
          tests.test_app_protocol
          tests.test_export_publication
          tests.test_external_processes
          tests.test_remote_assets
          tests.test_scene_lifecycle

      - name: Audit locked dependencies
        if: matrix.python == '3.14'
        run: uv audit --locked

      - name: Build and inspect distributions
        run: |
          uv build
          uv run --locked python -m twine check dist/*
          uv run --locked python tests/check_wheel.py

      - name: Store release-candidate distributions
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maniml-distributions
          path: dist/
          if-no-files-found: error

  integration:
    name: Integration (macOS 14, Python ${{ matrix.python }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install maniml
        run: uv sync --locked --no-dev

      - name: Run logic and headless integration tests
        run: >-
          uv run --locked --no-dev python -m unittest
          tests.test_source_map
          tests.test_ce_conformance
          tests.test_checkpoint_reload
          tests.test_modes
          tests.test_export
          tests.test_app
          tests.test_web_viewer
