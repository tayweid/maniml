name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install locked development environment
        run: uv sync --locked

      - name: Audit locked dependencies
        run: uv audit --locked

      - name: Build and inspect distributions
        run: |
          uv build
          uv run --locked python -m twine check dist/*
          uv run --locked python tests/check_wheel.py

      - name: Store distributions for manual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maniml-release-candidate
          path: dist/
          if-no-files-found: error
