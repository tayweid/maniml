name: ManimCE API drift

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare current public API
    runs-on: ubuntu-22.04

    steps:
      - name: Check out ManimLive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: maniml
          persist-credentials: false

      - name: Check out current ManimCE
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ManimCommunity/manim
          ref: main
          path: manimce
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Compare API names without importing upstream code
        working-directory: maniml
        run: python -m tests.ce_conformance.extract_ce_names ../manimce --check
