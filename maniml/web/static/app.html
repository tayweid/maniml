<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManimLive</title>
<link rel="icon" type="image/svg+xml" href="icons/maniml.svg">
<link rel="icon" type="image/png" href="icons/maniml-192.png">
<!-- Stamped as this page is served (web/assets.py), so a GET of a running
     engine says what it is serving: an install replaces files, it does not
     restart processes. -->
<meta name="maniml" content="__MANIML_VERSION__">
<meta name="theme-color" content="#18181a">
<link rel="stylesheet" href="shell.css">
<style>
  :root {
    --panel-raised: rgba(28, 27, 31, .94);
  }
  html, body { margin: 0; height: 100%; background: var(--frame);
    color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif; }
  input { font: inherit; }
  /* The page is the viewer's other room, in the same frame (shell.css):
     the bar across the top, and the room under it — the panel the frame's
     edge from the window's sides and bottom, scrolling inside itself. The
     page holds one thing at a time — an invitation to open a scene, or the
     reason the engine cannot be reached — so it sits in the middle of the
     room in an 820 px column rather than at its top with the rest of the
     height left empty. `margin-block: auto` rather than
     `justify-content: center`: auto margins collapse to zero once the
     content is taller than the room, so a long recents list scrolls from
     its top instead of being centred past the top edge where it cannot be
     reached. The padding is symmetric so that centring inside it is also
     centring in the room. */
  main { position: fixed; inset: var(--topbar) var(--edge) var(--edge);
    overflow-y: auto; border-radius: 12px; background: var(--bg);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05);
    padding: 40px max(24px, calc((100% - 2 * var(--edge) - 772px) / 2));
    display: flex; flex-direction: column; }
  #offline, #workspace { margin-block: auto; }
  /* The app is what is open here, so its name takes the pill. */
  h1 { font: inherit; margin: 0; }
  /* The engine's status, at the bar's right end as on the viewer: amber
     while it connects, green once it answers. */
  #status-dot { background: var(--dim); }
  body[data-connection="connecting"] #status-dot { background: var(--warn); }
  body[data-connection="connected"] #status-dot { background: #6ea576; }

  #offline { background: var(--glass); border: 1px solid var(--line);
    border-radius: 15px; padding: 25px 26px 22px;
    box-shadow: 0 18px 52px rgba(0,0,0,.18); }
  body[data-connection="connected"] #offline { display: none; }
  #offline h2 { font: 500 22px/1.2 Georgia, "Times New Roman", serif;
    letter-spacing: .015em; margin: 0 0 6px; }
  #offline p { color: var(--dim); margin: 0; }
  #connection-message { color: var(--warn); margin-top: 10px; }
  #connection-message:empty { display: none; }
  .command { display: flex; align-items: stretch; min-width: 0; margin-top: 14px;
    border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
    background: rgba(8,8,10,.52); }
  .command code { flex: 1; min-width: 0; padding: 10px 12px;
    color: #c9d1d9; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo,
    Consolas, monospace; overflow-x: auto; white-space: nowrap; }

  #workspace { display: none; }
  body[data-connection="connected"] #workspace { display: block; }
  /* An element with `display: none` still resolves its auto margins, which
     would leave the offline panel centred on the space the workspace would
     have taken. Only the visible one gets them. */
  #workspace[hidden], body[data-connection="connected"] #offline { margin-block: 0; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.08em; margin: 28px 0 10px; }
  /* No padding above: it was the gap under the bar when this sat at the top
     of the page, and now it is dead space inside a centred box — which
     centres the box while leaving the words themselves sitting low. */
  #hero { text-align: center; padding: 0 0 34px; }
  #hero .lede { font: 500 21px/1.3 Georgia, "Times New Roman", serif;
    letter-spacing: .015em; margin: 0 0 18px; }
  #open-hero { border: 1px solid var(--line-strong); border-radius: 11px;
    background: var(--glass); color: var(--text); padding: 10px 20px;
    cursor: pointer; box-shadow: 0 10px 26px rgba(0,0,0,.2); }
  #open-hero:hover { border-color: rgba(88,196,221,.5);
    background: rgba(88,196,221,.08); }
  #open-hero:disabled { opacity: .45; cursor: default; }
  .recent { display: flex; align-items: baseline; gap: 12px; width: 100%;
    text-align: left; background: var(--glass); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 14px; margin-bottom: 7px; cursor: pointer;
    font: inherit; color: var(--text);
    transition: border-color 140ms ease, background 140ms ease; }
  .recent:hover { border-color: rgba(88,196,221,.45);
    background: var(--panel-raised); }
  .recent.busy { opacity: .5; pointer-events: none; }
  .recent .name { font-family: Georgia, "Times New Roman", serif;
    letter-spacing: .03em; }
  .recent .dir { color: var(--dim); font-size: 11.5px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #root-note { color: var(--dim); font-size: 11px; text-align: center;
    margin: 30px 0 0; }
  #root { overflow-wrap: anywhere; }
  #error { color: var(--bad); font-size: 13px; margin-top: 10px;
    white-space: pre-wrap; display: none; }
  #error button { display: block; margin: 10px 0; border: 1px solid var(--line-strong);
    border-radius: 9px; background: var(--glass); color: var(--text);
    padding: 7px 14px; cursor: pointer; font: inherit; }
  #error button:hover { border-color: rgba(88,196,221,.5);
    background: rgba(88,196,221,.08); }
  #error button.busy { opacity: .5; pointer-events: none; }
  #progress { color: var(--dim); font-size: 13px; margin-top: 10px; }
  #empty { color: var(--dim); }
  @media (max-width: 520px) {
    main { padding: 24px 12px; }
    #toolbar { gap: 4px; }
    #status-text { display: none; }
    .command { display: block; }
    .command code { display: block; }
  }
</style>
</head>
<body data-connection="connecting">
<!-- The same bar as the viewer's (shell.css, bar.js), holding this room's
     equivalents: File, whose menu opens a scene, as the viewer's opens
     another; the app's name in the pill, since the app is what is open
     here; and at the right end the app's update when there is one and the
     engine's status. -->
<header id="toolbar" aria-label="ManimLive">
  <div class="bar-file">
    <button id="file-menu" class="icon-button" type="button" aria-label="File" aria-haspopup="menu" aria-expanded="false" aria-controls="file-list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="control-label">File</span>
    </button>
    <div id="file-list" class="bar-menu" role="menu" aria-label="File" hidden>
      <button id="openbtn" class="bar-menu-item" type="button" role="menuitem">Open a scene&hellip;</button>
    </div>
  </div>
  <div class="doc-pod">
    <div class="document-slug">
      <h1>ManimLive</h1>
    </div>
  </div>
  <div class="tb-end">
    <button id="updatebtn" class="icon-button" type="button" hidden aria-label="Update ManimLive">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14a8 8 0 0 0 14.9 3M20 10A8 8 0 0 0 5.1 7"/><path d="M4 4v4h4M20 20v-4h-4"/></svg>
      <span class="control-label">Update</span>
    </button>
    <span id="status" class="bar-pill" role="status" aria-live="polite">
      <span id="status-dot" class="status-dot"></span><span id="status-text">Connecting&hellip;</span>
    </span>
  </div>
</header>

<main>

  <section id="offline" aria-labelledby="offline-title">
    <h2 id="offline-title">Waiting for the engine</h2>
    <p>This page is served by your local ManimLive engine. If it has stopped,
       start it again from a terminal:</p>
    <div class="command"><code>maniml app .</code></div>
    <p id="connection-message"></p>
  </section>

  <section id="workspace">
    <div id="hero">
      <p class="lede">Open a scene file to begin.</p>
      <button id="open-hero">Open a scene&hellip;</button>
    </div>
    <div id="recents-section" hidden>
      <h2 class="section-title">Recent</h2>
      <div id="recents"></div>
    </div>
    <p id="root-note">Scenes open from <span id="root"></span></p>
    <p id="progress" hidden></p>
    <div id="error"></div>
  </section>
</main>
<script src="bar.js"></script>
<script>
"use strict";

// This page ships inside the maniml package and is served by the engine that
// runs the scenes, so the two can never be out of step and there is no
// cross-origin boundary to negotiate. The socket is the same origin as this
// page: nothing to configure, nothing to pair, and nothing to carry in the
// URL. The engine accepts it because it came from the page the engine served.
const CONTROL_URL = `ws://${location.host}/`;

const errorEl = document.getElementById("error");
// uv's steps while the engine prepares a scene's environment (one line at
// a time, under the request they belong to), cleared with the answer.
const progressEl = document.getElementById("progress");
function showProgress(step) {
  progressEl.textContent = step || "";
  progressEl.hidden = !step;
}
// Two ways in, one handler: the header slug and the hero button.
const openButtons = [
  document.getElementById("openbtn"),
  document.getElementById("open-hero"),
];
const statusText = document.getElementById("status-text");
const connectionMessage = document.getElementById("connection-message");

function setConnectionState(state, message, detail) {
  document.body.dataset.connection = state;
  statusText.textContent = message;
  connectionMessage.textContent = detail || "";
}

let control = null;
let reconnectTimer = null;
let nextId = 1;
const pending = new Map();

function rejectPending(message) {
  for (const entry of pending.values()) entry.reject(new Error(message));
  pending.clear();
}

function request(op, extra) {
  return new Promise((resolve, reject) => {
    if (!control || control.readyState !== WebSocket.OPEN) {
      reject(new Error("not connected"));
      return;
    }
    const id = nextId++;
    pending.set(id, { resolve, reject });
    control.send(JSON.stringify({ op, id, ...(extra || {}) }));
  });
}

function connectControl() {
  clearTimeout(reconnectTimer);
  setConnectionState("connecting", "Connecting…");
  try {
    control = new WebSocket(CONTROL_URL);
  } catch (error) {
    scheduleReconnect();
    return;
  }
  control.onmessage = (event) => {
    let data;
    try { data = JSON.parse(event.data); }
    catch (error) { return; }
    if (data.type === "ready") {
      setConnectionState("connected", "Connected");
      for (const button of openButtons) button.disabled = false;
      refresh();
      openRequested();
      return;
    }
    if (data.type === "progress") {
      if (pending.has(data.id)) showProgress(data.step);
      return;
    }
    const entry = pending.get(data.id);
    if (entry) {
      pending.delete(data.id);
      entry.resolve(data);
    }
  };
  // A closed socket only ever means the engine is not there yet: keep
  // retrying rather than putting the page into a state it cannot leave.
  control.onclose = () => {
    rejectPending("engine disconnected");
    setConnectionState("connecting", "Waiting for the engine…");
    scheduleReconnect();
  };
  control.onerror = () => {};
}

function scheduleReconnect() {
  reconnectTimer = setTimeout(connectControl, 1500);
}
connectControl();

// File is the bar's text menu (bar.js), and ManimLive.app's update is a
// tile at the bar's right end once the shell knows of a newer build; a
// failed install says why in the error box too.
ManimlBar.menu(document.getElementById("file-menu"), document.getElementById("file-list"));
// The landing page holds no scene: the window's document is none, so the
// Window menu and an update's relaunch do not name the scene just left
// (File → Open another scene… comes back here in the same window). A
// ?open=<path> launch is unaffected: the viewer it goes on to reports the
// scene again on its first state.
ManimlBar.setDocument(null);
ManimlBar.updates(document.getElementById("updatebtn"), {
  failed(text) {
    errorEl.textContent = text;
    errorEl.style.display = "block";
  },
});

async function openScene(path, scene, button) {
  await startScene("open", { path, scene }, button);
}

// The engine's answer to an open (or to an install): the viewer, or why
// not. A missing import whose package uv already had on this Mac was added
// to the file's header and the scene started before the answer came; one
// that would have to be downloaded is offered as a button (environment.py:
// using what is downloaded needs no permission, downloading does).
async function startScene(op, extra, button) {
  errorEl.style.display = "none";
  errorEl.replaceChildren();
  showProgress("");
  if (button) button.classList.add("busy");
  try {
    const data = await request(op, extra);
    if (data.viewer_url) {
      window.location = data.viewer_url;
      return;
    }
    showFailure(data);
  } catch (error) {
    showFailure({ error: String(error) });
  } finally {
    showProgress("");
    if (button) button.classList.remove("busy");
  }
}

function showFailure(data) {
  errorEl.replaceChildren();
  errorEl.append((data.error || "failed to open")
    + (data.hint ? "\n\n" + data.hint : ""));
  if (data.install) {
    const install = document.createElement("button");
    install.textContent = `Download ${data.install.distribution}`;
    install.onclick = () => startScene("install", data.install, install);
    errorEl.append(install);
  }
  if (data.log) errorEl.append((data.install ? "" : "\n\n") + data.log);
  errorEl.style.display = "block";
}

function recentRow(entry) {
  const row = document.createElement("button");
  row.className = "recent";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = entry.name;
  const dir = document.createElement("span");
  dir.className = "dir";
  dir.textContent = entry.dir;
  row.append(name, dir);
  // No scene chips: a file opens at its first scene and the viewer's own
  // picker switches from there.
  row.onclick = () => openScene(entry.path, null, row);
  return row;
}

async function refresh() {
  try {
    const data = await request("recents");
    document.getElementById("root").textContent = data.root;
    const recentsEl = document.getElementById("recents");
    recentsEl.replaceChildren();
    document.getElementById("recents-section").hidden = !data.recents.length;
    for (const entry of data.recents) recentsEl.appendChild(recentRow(entry));
  } catch (error) {
    if (document.body.dataset.connection === "connected") {
      setConnectionState("connecting", "Engine disconnected");
    }
  }
}

// The engine shows the platform's own file dialog: no browser file-handle
// indirection, so it returns a real path the watcher and the scene's
// __file__-relative imports can both use.
async function chooseAndOpen() {
  errorEl.style.display = "none";
  if (document.body.dataset.connection !== "connected") return;
  for (const button of openButtons) button.disabled = true;
  try {
    const data = await request("choose");
    if (data.cancelled) return;
    if (data.error) throw new Error(data.error);
    // Let the engine pick: a file opens at its first scene, and the viewer's
    // scene picker switches from there.
    await openScene(data.file.path, null, null);
  } catch (error) {
    errorEl.textContent = String(error);
    errorEl.style.display = "block";
  } finally {
    if (document.body.dataset.connection === "connected") {
      for (const button of openButtons) button.disabled = false;
    }
  }
}

for (const button of openButtons) button.onclick = chooseAndOpen;

// A file opened from outside the page — a Finder double-click, the command
// line, the app's Open panel — arrives as ?open=<absolute path> (how the
// Claerbout shell hands a document to any of its apps). Opened once, when
// the engine is there; the query is dropped from the address so a reload
// does not open it again. The engine decides whether the path may open:
// inside its root, or granted through a native dialog.
let openHandled = false;
function openRequested() {
  if (openHandled) return;
  openHandled = true;
  const wanted = new URLSearchParams(location.search).get("open");
  if (!wanted) return;
  history.replaceState(null, "", location.pathname);
  openScene(wanted, null, null);
}
</script>
</body>
</html>
