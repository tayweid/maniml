<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maniml</title>
<link rel="icon" href="icons/maniml-192.png">
<meta name="theme-color" content="#2b2a2d">
<link rel="stylesheet" href="shell.css">
<style>
  :root {
    --glass-solid: #1b1a1e;
  }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 72px 22px 78px;
  }
  /* The console. Toggled by hand and never by itself: stepping through a
     scene prints on every arrow key, so a panel that opened on output would
     be opening constantly — and it must never appear mid-presentation. */
  #console-toggle {
    position: fixed; top: 14px; right: 12px; z-index: 60;
    display: inline-flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; padding: 0;
    background: var(--glass); border: 1px solid var(--line);
    border-radius: 999px; color: var(--text); cursor: pointer;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    opacity: .45; transition: opacity .25s ease, background .12s;
  }
  #console-toggle:hover, body.console #console-toggle {
    opacity: 1; background: rgba(255,255,255,.12);
  }
  #console-toggle svg {
    width: 16px; height: 16px; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  #console {
    position: fixed; z-index: 19; top: 66px; right: 12px; bottom: 74px;
    width: 340px; display: none; flex-direction: column;
    border: 1px solid var(--line); border-radius: 13px;
    background: var(--glass); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    overflow: hidden;
  }
  body.console #console { display: flex; }
  body.console #stage { padding-right: 366px; }
  /* The panel is a column between the two bars, so the bars give up its
     width rather than running underneath it. */
  body.console #toolbar, body.console #navbar { padding-right: 366px; }
  /* Presenting is where a scene's own output matters most, so the console
     keeps its place in full screen — it rides with the rest of the chrome,
     receding when the chrome does. It overlays there rather than reflowing:
     the frame must not resize every time the pointer nears an edge. */
  body.fullscreen #stage { padding-right: 0; }
  body.fullscreen #toolbar, body.fullscreen #navbar { padding-right: 14px; }
  #console-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-bottom: 1px solid var(--line);
    color: var(--dim); font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase;
  }
  #console-clear {
    border: 0; background: none; color: var(--dim); cursor: pointer;
    font: inherit; letter-spacing: normal; text-transform: none;
    padding: 2px 6px; border-radius: 6px;
  }
  #console-clear:hover { background: rgba(255,255,255,.06); color: var(--text); }
  #console-lines {
    flex: 1; min-height: 0; overflow-y: auto; padding: 9px 12px;
    font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  #console-lines .line { color: var(--dim); }
  #console-lines .line.err { color: #e8a0a0; }
  #console-empty { color: var(--dim); font-style: italic; }
  @media (max-width: 860px) {
    #console { display: none !important; }
    body.console #stage { padding-right: 22px; }
  }

  /* Full screen: the stage padding is what reserves room for the chrome, so
     dropping it lets the frame fill the display. The pods stay in the DOM and
     fade, but `visibility` has to go too — an invisible pod would still eat
     clicks meant for the canvas. */
  body.fullscreen #stage { padding: 0; }
  body.fullscreen #stage canvas { border-radius: 0; box-shadow: none; }
  body.fullscreen #toolbar,
  body.fullscreen #navbar,
  body.fullscreen #console {
    opacity: 0; visibility: hidden;
    transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
  }
  body.fullscreen #toolbar { transform: translateY(-12px); }
  body.fullscreen #navbar { transform: translateY(14px); }
  body.fullscreen #console { transform: translateX(12px); }
  body.fullscreen.chrome #toolbar,
  body.fullscreen.chrome #navbar,
  body.fullscreen.chrome #console {
    opacity: 1; visibility: visible; transform: none;
  }
  body.fullscreen.idle, body.fullscreen.idle #view, body.fullscreen.idle .altview {
    cursor: none;
  }
  #fullscreen .fs-exit { display: none; }
  body.fullscreen #fullscreen .fs-enter { display: none; }
  body.fullscreen #fullscreen .fs-exit { display: block; }

  #stage canvas {
    border-radius: 5px;
    box-shadow: 0 18px 55px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.035);
    background: #000;
  }
  #connection-overlay {
    position: absolute; z-index: 10; left: 50%; top: 50%;
    width: min(430px, calc(100% - 42px)); transform: translate(-50%, -50%);
    padding: 24px 25px 22px; border: 1px solid var(--line-strong);
    border-radius: 15px; background: rgba(24, 23, 27, .94);
    box-shadow: 0 20px 65px rgba(0,0,0,.48);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  #connection-overlay[hidden] { display: none; }
  .connection-mark { display: flex; align-items: center; gap: 5px; margin-bottom: 16px; }
  .connection-mark span { width: 7px; height: 7px; border-radius: 50%;
    background: var(--bad); }
  .connection-mark::after { content: ""; width: 28px; height: 1px;
    margin-left: 2px; background: var(--line-strong); }
  #connection-title { margin: 0 0 7px; font: 500 20px/1.2 Georgia,
    "Times New Roman", serif; letter-spacing: .015em; }
  #connection-detail { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
  .connection-actions { display: flex; gap: 7px; margin-top: 19px; }
  .connection-actions button { padding: 7px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: rgba(255,255,255,.035); color: var(--text);
    cursor: pointer; }
  .connection-actions button:hover, .connection-actions button:focus-visible {
    border-color: var(--line-strong); background: rgba(255,255,255,.07); outline: none; }
  .connection-actions button[hidden] { display: none; }
  #open-from-error { color: var(--dim); background: transparent; }
  #view {
    max-width: 100%; max-height: 100%;
    outline: none; cursor: crosshair;
  }
  /* Present-from-video: the recording replaces the live stage wholesale */
  #playback-video { display: none; max-width: 100%; max-height: 100%;
    border-radius: 5px; background: #000;
    box-shadow: 0 18px 55px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.035); }
  body.playback #playback-video { display: block; }
  body.playback #view, body.playback .altview { display: none !important; }
  .altview { display: none; cursor: crosshair; }
  body.alt #view { display: none; }
  body.alt .altview.current { display: block; max-width: 100%; max-height: 100%; }
  body.alt.compare #view { display: block; max-width: 49.5%; }
  body.alt.compare .altview.current { max-width: 49.5%; }

  /* The chrome is Plass's, and deliberately its metrics rather than an
     imitation of them: a 60px bar, 42px pods pressed into a run, contents
     asleep until the pointer nears the bar, and flyouts that lay the group's
     labelled icons OVER their trigger so the cursor never crosses a gap. */
  #toolbar {
    position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: 60px;
    display: flex; justify-content: center; align-items: center;
    gap: 5px; padding: 0 14px; pointer-events: none;
  }
  /* Both a pod and a flyout carry backdrop-filter, which is a stacking
     context — so a flyout's z-index is trapped inside its own pod and a
     LATER sibling paints over it. Lift whichever pod the cursor is in.
     (Plass learned this one the hard way; it is not decoration.) */
  #toolbar > *, #navbar > * { position: relative; }
  #toolbar > *:hover, #toolbar > *:focus-within,
  #navbar > *:hover, #navbar > *:focus-within { z-index: 20; }

  .doc-pod { gap: 9px; padding: 0 6px 0 16px; }
  .tools-pod { gap: 4px; }
  /* A group inside a pod: related controls plus the quiet text they own. */
  .tool-group { display: inline-flex; align-items: center; gap: 2px; }
  #file-name { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .scene-picker { position: relative; display: inline-flex; }
  #scene-name {
    padding: 1px 5px; border: 0; border-radius: 6px; background: transparent;
    color: var(--dim); font: inherit; font-size: 12px; letter-spacing: .035em;
    cursor: pointer; transition: color 140ms ease, background 140ms ease;
  }
  #scene-name:hover, #scene-name:focus-visible {
    color: var(--text); background: rgba(255,255,255,.07); outline: none;
  }
  /* A file with a single scene has nothing to switch to: keep the name, drop
     the affordance rather than opening an empty menu. */
  #scene-name:disabled { cursor: default; background: transparent; color: var(--dim); }
  #scene-menu {
    position: absolute; z-index: 40; top: calc(100% + 9px); left: -4px;
    display: flex; flex-direction: column; gap: 1px; padding: 4px;
    min-width: 150px; max-height: min(46vh, 340px); overflow-y: auto;
    border-radius: 11px; background: var(--glass-light);
    border: 1px solid rgba(255,255,255,.5); box-shadow: 0 10px 28px rgba(0,0,0,.3);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  #scene-menu[hidden] { display: none; }
  .scene-option {
    padding: 6px 10px; border: 0; border-radius: 7px; background: transparent;
    color: var(--ink); font: inherit; font-size: 12px; text-align: left;
    white-space: nowrap; cursor: pointer; opacity: .72;
  }
  .scene-option:hover, .scene-option:focus-visible {
    background: rgba(20,19,22,.08); opacity: 1; outline: none;
  }
  .scene-option[aria-current="true"] { font-weight: 650; opacity: 1; }

  /* The icon button, its word tag, and the slug are shared with the landing
     page and live in shell.css. A flyout's actions are the same object one
     size up, but must not inherit the bar's sleep tier — the open flyout is
     awake by definition. */
  .fly-action {
    position: relative; display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 8px; background: transparent;
    color: var(--text); cursor: pointer;
    transition: color 140ms ease, background 140ms ease, transform 140ms ease;
  }
  .fly-action svg {
    fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  #navbar .control-label { top: auto; bottom: calc(100% + 10px);
    transform: translate(-50%, 3px); }
  .fly-action:hover .control-label, .fly-action:focus-visible .control-label {
    opacity: 1; visibility: visible; transform: translate(-50%, 0);
  }

  /* The flyout: a pill a step lighter than the pod it covers, centred on its
     trigger so it reads as a card sitting ON TOP of the bar. Its buttons are
     the full rail size — the open state is the bigger object. */
  .flyover { position: relative; display: inline-flex; }
  .flyout {
    position: absolute; z-index: 30; left: 50%; top: 50%;
    display: flex; align-items: center; gap: 2px; padding: 5px 8px;
    background: color-mix(in srgb, #3a3840 94%, transparent);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    box-shadow: 0 5px 18px rgba(0,0,0,.45);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    opacity: 0; visibility: hidden; transform: translate(-50%, -50%);
    transition: opacity 140ms ease, visibility 140ms; pointer-events: none;
  }
  .flyover:hover .flyout, .flyover:focus-within .flyout {
    opacity: 1; visibility: visible; pointer-events: auto;
  }
  .fly-action { width: 40px; height: 40px; opacity: 1; font-size: 11px;
    letter-spacing: .02em; }
  .fly-action svg { width: 22px; height: 22px; }
  .fly-action[hidden] { display: none; }
  .fly-action:hover, .fly-action:focus-visible { background: rgba(255,255,255,.13); }

  #position {
    min-width: 54px; padding: 0 8px; text-align: center; color: var(--dim);
    font-size: 11px; letter-spacing: .045em; text-transform: uppercase;
  }
  #position strong { color: var(--text); font-weight: 550; }
  #position-total { color: var(--dim); }
  #job-status {
    display: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    padding: 0 6px; color: var(--dim); font-size: 11px;
  }
  #export-pod.active #job-status { display: block; }
  #export-pod.working .export-icon { color: var(--warn); opacity: 1; }
  #export-pod.success .export-icon { color: var(--good); opacity: 1; }
  #export-pod.failed .export-icon { color: var(--bad); opacity: 1; }
  #glwarn { display: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    color: var(--warn); font-size: 11px; padding: 0 6px 0 0; }
  #glwarn.on { display: block; }
  #connection-pod { padding: 0 6px 0 8px; gap: 7px; color: var(--dim); font-size: 11px;
    border-left: 1px solid var(--line); margin-left: 2px; }
  #conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 3px rgba(121,191,139,.08); }
  #conn { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  body.disconnected #conn-dot { background: var(--bad); box-shadow: 0 0 0 3px rgba(218,119,119,.08); }
  body.disconnected #conn { color: #cf9494; }
  body.disconnected #export-menu {
    opacity: .16; pointer-events: none;
  }

  /* ---------- the presenter's bar ---------- */
  #navbar {
    position: fixed; z-index: 18; left: 0; right: 0; bottom: 12px;
    display: flex; justify-content: center; align-items: center;
    gap: 5px; padding: 0 14px; pointer-events: none;
  }
  .transport-pod { padding: 0 5px; }
  .rail-pod { flex: 1 1 auto; max-width: 620px; min-width: 0;
    gap: 12px; padding: 0 12px 0 13px; }
  .view-pod { padding: 0 5px; }
  #present.active { color: var(--good); opacity: 1; }
  #present { position: relative; }
  #present.stale::after { content: ""; position: absolute; top: 6px; right: 6px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--warn); opacity: .7; }

  /* The rail is chips and the links between them, in one row: a link is the
     stretch of scene an animation crosses, so it is a real element that can
     light up while that animation plays — rather than one line drawn behind
     everything, which could only ever be lit end to end. */
  #rail {
    flex: 1; min-width: 0; height: 30px;
    display: flex; align-items: center; overflow-x: auto;
    padding: 5px 2px; scrollbar-width: none;
  }
  #rail::-webkit-scrollbar { display: none; }
  .link {
    position: relative; flex: 1 1 26px; min-width: 13px; height: 1px;
    margin: 0 5px; background: var(--line-strong);
  }
  .link.past { background: #77727a; }
  .link.future { background: none; border-top: 1px dashed #5e5a62; }
  /* The lit fill grows out of the chip the move started from — its own
     easing, on its own clock. It says WHICH stretch is being crossed, and
     deliberately not how far along it is: the animation itself is on screen
     at full size, and a claim about progress would have to be honest through
     reverse morphs and fast-forwards too. */
  .link .fill {
    position: absolute; left: 0; right: 0; top: -1px; height: 3px;
    border-radius: 2px; background: var(--accent);
    box-shadow: 0 0 9px rgba(88,196,221,.45);
    transform: scaleX(0); transform-origin: left center;
    transition: transform 200ms ease, opacity 200ms ease; opacity: 0;
  }
  .link.lit .fill { transform: scaleX(1); opacity: 1; }
  .link.lit.back .fill { transform-origin: right center; }
  /* Parked between pausepoints (UP/DOWN): the same fill stands lit — the
     position is a place ON the stretch, so the dash is highlighted and no
     dot claims the ring. */
  .link.mid .fill { transform: scaleX(1); opacity: 1; }
  .chip {
    position: relative; z-index: 1; width: 11px; height: 11px; padding: 0;
    border-radius: 50%; flex: none; background: var(--glass-solid);
    border: 1px solid #5e5a62; cursor: pointer;
    transition: transform 120ms ease, border-color 120ms ease, background 120ms ease,
      box-shadow 200ms ease;
  }
  /* Hover grows the chip but never paints the accent ring: the accent
     outline is reserved for nothing — a dot is lit or it isn't. */
  .chip:hover, .chip:focus-visible { transform: scale(1.35); outline: none; }
  .chip.past { background: #77727a; border-color: #77727a; }
  .chip.current { background: var(--accent); border-color: var(--accent);
    transform: scale(1.35); box-shadow: 0 0 0 4px rgba(88,196,221,.12); }
  .chip.future { background: var(--glass-solid); border-style: dashed; border-color: #5e5a62; }
  /* A unit whose pausepoint count is not knowable until it runs — a loop of
     plays, or a branch — is drawn as a stack rather than as one dot, so the
     rail stops implying a count it does not have. */
  /* Stacked with box-shadow, which paints behind the chip's own background,
     so the copies recede to the right. It keeps the dashed future border:
     these are the same kind of thing as its neighbours, and there are simply
     more of them than the rail can count. */
  .chip.many {
    box-shadow: 4px 0 0 -1px var(--glass-solid), 4px 0 0 0 rgba(94,90,98,.6),
                8px 0 0 -2px var(--glass-solid), 8px 0 0 -1px rgba(94,90,98,.38);
    margin-right: 9px;
  }
  /* While a move is in flight the rail shows the STRETCH, not a point: the
     ring lifts off the chip being left — it renders as an ordinary passed
     chip — and the lit dash is the ONLY thing that reads as active. The
     destination chip stays plain; its dot lights on arrival. */
  body.moving .chip.current {
    box-shadow: none; transform: scale(1);
    background: #77727a; border-color: #77727a;
  }
  /* A within-stack move has no dash between two chips to light, so the
     stack breathes instead — size only, no accent outline. */
  @keyframes chip-working { 0%, 100% { transform: scale(1.1); } 50% { transform: scale(1.45); } }
  body.moving .chip.working {
    animation: chip-working 900ms ease-in-out infinite;
  }

  @media (max-width: 860px) {
    #file-name { max-width: 125px; }
    #stage { padding-inline: 12px; }
  }
  @media (max-width: 620px) {
    #toolbar, #navbar { gap: 4px; padding-inline: 7px; }
    .pod { height: 38px; padding-inline: 4px; }
    .doc-pod { padding-left: 12px; }
    .icon-button { width: 31px; height: 31px; }
    #scene-name, .slug-separator, #connection-pod #conn { display: none; }
    #connection-pod { border-left: 0; }
    #file-name { max-width: 104px; }
    #position { min-width: 54px; padding-inline: 3px; }
    #job-status { max-width: 95px; }
    #navbar { bottom: 8px; }
    #stage { padding: 62px 8px 72px; }
  }
</style>
</head>
<body class="disconnected">
<div id="stage">
  <canvas id="view" width="1920" height="1080" tabindex="0"></canvas>
  <canvas id="glview" class="altview" title="WebGL2 client render"></canvas>
  <canvas id="gpuview" class="altview" title="WebGPU client render"></canvas>
  <video id="playback-video" playsinline preload="auto"></video>
  <section id="connection-overlay" role="alert" hidden>
    <div class="connection-mark" aria-hidden="true"><span></span><span></span></div>
    <h2 id="connection-title">Can&rsquo;t reach the local engine</h2>
    <p id="connection-detail"></p>
    <div class="connection-actions">
      <button id="retry-connection">Retry</button>
      <button id="open-from-error">Open another scene</button>
      <button id="dismiss-overlay" hidden>Dismiss</button>
    </div>
  </section>
</div>

<header id="toolbar" class="pod-run" aria-label="Scene controls">
  <div class="pod doc-pod">
    <div class="document-slug" title="Current scene file">
      <span id="file-name">scene.py</span><span class="slug-separator">&middot;</span><span class="scene-picker"><button id="scene-name" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Switch scene">Scene</button><span id="scene-menu" role="menu" aria-label="Scenes in this file" hidden></span></span>
    </div>
    <div class="flyover">
      <button id="file-menu" class="icon-button" aria-label="File options" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span class="control-label">File</span>
      </button>
      <div class="flyout" role="menu" aria-label="File options">
        <button id="open-file" class="fly-action" role="menuitem" aria-label="Open another scene">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="control-label">Open</span>
        </button>
      </div>
    </div>
  </div>

  <div class="pod tools-pod">
    <span id="export-pod" class="tool-group">
      <button id="export-video" class="icon-button export-icon" aria-label="Render video and pausepoints" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg><span class="control-label">Download</span>
      </button>
      <span id="job-status" role="status" aria-live="polite"></span>
    </span>

    <button id="restart-scene" class="icon-button" aria-label="Reload scene from source" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M18.2 16.5A8 8 0 1 1 19.7 9L20 12"/></svg>
      <span class="control-label">Restart</span>
    </button>

    <span id="connection-pod" class="tool-group" title="Connection to the local ManimLive engine">
      <span id="conn-dot"></span><span id="conn">Connecting</span>
    </span>
    <span id="glwarn"></span>
  </div>
</header>

<!-- The console's handle: a quiet floating pill in the corner its panel
     opens under, so the way in and the way out are the same spot (Knuth's
     view toggle). Fixed and outside the toolbar because a scene's output
     matters most mid-presentation — it must not recede with the chrome. -->
<button id="console-toggle" aria-label="Console" aria-pressed="false" title="Console (C)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 8 4 4-4 4"/><path d="M12 16h7"/></svg>
</button>

<aside id="console" aria-label="Python output">
  <div id="console-head">
    <span>Session</span>
    <button id="console-clear" type="button">Clear</button>
  </div>
  <div id="console-lines"><div id="console-empty">No output yet.</div></div>
</aside>

<!-- The presenter's bar: everything you touch while showing a scene is here,
     and the rail it moves along is one more pod in the same run. -->
<div id="navbar" class="pod-run" aria-label="Presentation controls">
  <div class="pod transport-pod">
    <button id="previous" class="icon-button" aria-label="Play previous animation in reverse" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg><span class="control-label">Back&nbsp; &larr;</span>
    </button>
    <div id="position"><strong id="position-now">1</strong><span id="position-total"> / &mdash;</span></div>
    <button id="next" class="icon-button" aria-label="Play next animation" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg><span class="control-label">Next&nbsp; &rarr;</span>
    </button>
  </div>

  <div class="pod rail-pod">
    <div id="rail" role="list" aria-label="Scene pausepoints"></div>
  </div>

  <div class="pod view-pod">
    <button id="present" class="icon-button" aria-label="Present mode" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H4zM12 15v4M8 21l4-2 4 2"/></svg>
      <span class="control-label">Present</span>
    </button>
    <button id="fullscreen" class="icon-button" aria-label="Full screen" aria-pressed="false" hidden>
      <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>
      <span class="control-label">Full screen&nbsp; F</span>
    </button>
  </div>
</div>
<script src="gl.js"></script>
<script src="webgpu.js"></script>
<script src="presentation.js"></script>
<script src="rail.js"></script>
<script>
"use strict";
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const railEl = document.getElementById("rail");
// Transport. Today the engine is a local process reached over a WebSocket on
// the very port that served this page, so the address is simply where we are.
// Everything below this line speaks only in protocol messages, so an in-page
// engine (Pyodide) would replace `send` and the message pump and leave the
// rest of the viewer untouched.
// A scene opened through the app is reached at /scene/<id> on the app's own
// origin, which relays to the process running it; a scene process serving its
// own page answers at the root. Either way the address is where we are.
const sceneParam = new URLSearchParams(location.search).get("scene");
const wsUrl = "ws://" + location.host
  + (sceneParam ? "/scene/" + encodeURIComponent(sceneParam) : "/");
// The scene's output folders (/present/, /baked/) take the same detour as
// the socket: through the app's relay when the page was opened through it.
const scenePrefix = sceneParam
  ? "/scene/" + encodeURIComponent(sceneParam) : "";
const appUrl = new URLSearchParams(location.search).get("app") || "/";
document.getElementById("open-file").onclick = () => { window.location = appUrl; };
let ws = null;
let reconnectCount = 0;
let connectedBoot = null;   // engine boot id first seen by this page
let reconnectTimer = null;
const MAX_RECONNECTS = 3;
const connectionOverlay = document.getElementById("connection-overlay");
const connectionTitle = document.getElementById("connection-title");
const connectionDetail = document.getElementById("connection-detail");

function showOverlay(title, detail, { canRetry = false, canDismiss = false } = {}) {
  connectionTitle.textContent = title;
  connectionDetail.textContent = detail;
  document.getElementById("retry-connection").hidden = !canRetry;
  document.getElementById("dismiss-overlay").hidden = !canDismiss;
  connectionOverlay.hidden = false;
}

function showConnectionIssue(title, detail, canRetry) {
  document.body.classList.add("disconnected");
  showOverlay(title, detail, { canRetry });
}

function hideConnectionIssue() {
  connectionOverlay.hidden = true;
}

function scheduleReconnect() {
  reconnectCount += 1;
  if (reconnectCount >= MAX_RECONNECTS) {
    document.getElementById("conn").textContent = "Engine unavailable";
    showConnectionIssue(
      "Can’t reach the local engine",
      "The scene process is no longer responding. Retry, or reopen the scene "
        + "from ManimLive to start a fresh session.",
      true
    );
    return;
  }
  document.getElementById("conn").textContent = "Reconnecting";
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, 700 * reconnectCount);
}

function connect(manualRetry = false) {
  clearTimeout(reconnectTimer);
  if (manualRetry) {
    reconnectCount = 0;
    hideConnectionIssue();
  }
  document.body.classList.add("disconnected");
  document.getElementById("conn").textContent = "Connecting";
  try {
    ws = new WebSocket(wsUrl);
  } catch (error) {
    scheduleReconnect();
    return;
  }
  ws.binaryType = "blob";
  // A closed socket means the scene process is gone or still starting; it is
  // never a credential to discard, so reconnecting is always the right move.
  ws.onclose = () => {
    document.body.classList.add("disconnected");
    scheduleReconnect();
  };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    if (typeof e.data === "string") {
      const data = JSON.parse(e.data);
      if (data.type === "ready") {
        // A page keeps the JS it loaded until reloaded — stale handlers
        // driving a newer engine is a whole class of confusion. Every
        // engine process announces a fresh boot id; if the id CHANGES
        // within one page's lifetime, the engine restarted (a pip
        // upgrade, or any dev restart under an editable install) and this
        // page's JS may predate it: reload once to match. Compared to the
        // first-seen id rather than a page stamp, because under the app
        // the page and the scene engine are different processes.
        if (data.boot) {
          if (connectedBoot === null) connectedBoot = data.boot;
          else if (data.boot !== connectedBoot) {
            location.reload();
            return;
          }
        }
        reconnectCount = 0;
        document.body.classList.remove("disconnected");
        document.getElementById("conn").textContent = "Connected";
        hideConnectionIssue();
        applyCapabilities(data.capabilities || []);
        canvas.focus();
        // WebGPU is the live viewer's primary path.  Initialize it only once
        // the engine is connected, then request the geometry snapshot.
        // selectRenderer falls back visibly to Pixel on older browsers.
        if (renderer !== "pixel") {
          const segment = document.querySelector(
            `#renderers .seg[data-renderer="${renderer}"]`
          );
          void selectRenderer(renderer, segment);
        }
      } else if (data.type === "log") {
        appendLog(data.lines || [], !!data.replace);
      } else {
        handleMessage(data);
      }
    }
    else { handleFrame(e.data); }
  };
}
connect();

document.getElementById("retry-connection").onclick = () => connect(true);
document.getElementById("dismiss-overlay").onclick = () => hideConnectionIssue();
document.getElementById("open-from-error").onclick = () => { window.location = appUrl; };

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function applyCapabilities(values) {
  const capabilities = new Set(values);
  document.getElementById("restart-scene").hidden = !capabilities.has("restart");
  document.getElementById("export-video").hidden = !capabilities.has("export");
}

// -- Frames (1 header byte: 0x01 JPEG, 0x02 PNG; image is GL bottom-up.
//    0x03 is a geometry payload, routed to the selected client renderer) --
// Frames arrive on a socket, not on a display clock. Painting one the moment
// it lands leaves it on screen for one refresh or for two depending on where
// it happened to fall relative to vsync, so an evenly produced stream is
// shown unevenly — motion judders and a short transition reads as two steps
// with a beat between them. Nothing is dropped and nothing is late; the
// frames are simply presented at the wrong moments. A video player never has
// this problem because it presents on the display's clock, which is why an
// exported file looks smooth where this did not.
//
// So the socket only ever *decodes*. Presenting happens in
// requestAnimationFrame: at most one paint per refresh, always the newest
// thing received, for the pixel stream and the client renderers alike.
// A pixel frame is a whole picture, so only the newest one is worth keeping.
// A geometry payload is NOT: the server marks a batch cached once it has sent
// it, so a dropped payload takes that batch's only transmission with it and
// the client has to ask for everything again. Geometry therefore queues — all
// of it, in arrival order — and only the moment it is applied moves.
let pendingBitmap = null;      // decoded pixel frame awaiting a refresh
let geometryQueue = [];        // every geometry payload, in arrival order
// How far behind the newest state the display may fall before it stops
// showing every intermediate one and catches up instead.
const MAX_QUEUED_STATES = 6;
let presentScheduled = false;
let decodingFrame = false, queuedFrameBlob = null;

function schedulePresent() {
  if (presentScheduled) return;
  presentScheduled = true;
  requestAnimationFrame(present);
}

function present() {
  presentScheduled = false;
  if (pendingBitmap) {
    const bmp = pendingBitmap;
    pendingBitmap = null;
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
      canvas.width = bmp.width; canvas.height = bmp.height;
    }
    ctx.save();
    ctx.translate(0, canvas.height);
    ctx.scale(1, -1);
    ctx.drawImage(bmp, 0, 0);
    ctx.restore();
    bmp.close();
  }
  if (geometryQueue.length) {
    // One scene state per refresh. These payloads are deltas, so every one
    // has to be applied in order -- but applying several within a single
    // refresh means only the last is ever seen, and the states between
    // collapse into one larger jump. That is the same defect as dropping
    // them, just spelled differently, and it is what a run_time=1/10 play
    // cannot survive: it only has three states to begin with.
    //
    // The engine emits at the scene's frame rate, so on a 60Hz display one
    // per refresh always drains faster than they arrive. The catch-up is
    // for when it does not -- a throttled or backgrounded tab, where the
    // queue would otherwise grow into unbounded latency and memory.
    const backlog = geometryQueue.length - MAX_QUEUED_STATES;
    if (backlog > 0) {
      for (let i = 0; i < backlog; i++) handleGeometry(geometryQueue.shift());
    }
    handleGeometry(geometryQueue.shift());
    if (geometryQueue.length) schedulePresent();
  }
}

async function handleFrame(blob) {
  const head = new Uint8Array(await blob.slice(0, 1).arrayBuffer())[0];
  if (head === 3) {
    geometryQueue.push(await blob.arrayBuffer());
    schedulePresent();
    return;
  }
  if (decodingFrame) { queuedFrameBlob = blob; return; }  // newest wins
  decodingFrame = true;
  try {
    let next = blob;
    while (next) {
      try {
        const bmp = await createImageBitmap(next.slice(1));
        // Superseded before it was ever shown: decoding is faster than the
        // display, so this is the normal case rather than an error one.
        if (pendingBitmap) pendingBitmap.close();
        pendingBitmap = bmp;
        schedulePresent();
      } catch (error) {
        // A frame that will not decode is one frame lost; carrying on with
        // the queue matters more than the frame does.
        console.error("frame decode failed:", error);
      }
      next = queuedFrameBlob;
      queuedFrameBlob = null;
    }
  } finally {
    // Never leave a blob queued behind a decode that threw: the next frame
    // would decode, then this one after it, and the picture would jump back.
    decodingFrame = false;
    queuedFrameBlob = null;
  }
}

// -- Client renderers: Pixel is the server stream; WebGL2 and WebGPU
//    render geometry payloads in the browser. "split" shows the pixel
//    stream beside the client render for comparison. --
const glWarn = document.getElementById("glwarn");
const backends = {
  gl: { module: ManimlGL, canvas: document.getElementById("glview"),
        ready: false },
  gpu: { module: ManimlWGPU, canvas: document.getElementById("gpuview"),
         ready: false },
};
const DEFAULT_RENDERER = "gpu";
let renderer = DEFAULT_RENDERER;
let split = false;

function applyRendererUI() {
  document.body.classList.toggle("alt", renderer !== "pixel");
  document.body.classList.toggle("compare", renderer !== "pixel" && split);
  for (const [name, backend] of Object.entries(backends)) {
    backend.canvas.classList.toggle("current", renderer === name);
  }
  if (renderer === "pixel" && glWarn) glWarn.classList.remove("on");
}

function sendRendererMode() {
  send({ type: "mode", geometry: renderer !== "pixel",
         pixels: renderer === "pixel" || split });
  if (renderer !== "pixel") send({ type: "geometry_request" });
}

async function selectRenderer(name, seg) {
  if (name !== "pixel") {
    const backend = backends[name];
    try {
      if (!backend.ready) {
        await backend.module.init(backend.canvas);
        // Evicted a batch the server still considers sent: ask for a
        // full resend on the next payload
        backend.module.onCacheMiss = () => send({ type: "geometry_reset" });
        backend.ready = true;
      }
    } catch (err) {
      if (seg) {
        seg.classList.add("failed");
        seg.title = "unavailable: " + err.message;
      }
      renderer = "pixel";
      applyRendererUI();
      glWarn.textContent = "WebGPU unavailable; using Pixel: " + err.message;
      glWarn.classList.add("on");
      sendRendererMode();
      return false;
    }
  }
  renderer = name;
  applyRendererUI();
  sendRendererMode();
  return true;
}

applyRendererUI();

let glQueue = Promise.resolve();
function handleGeometry(arrayBuffer) {
  const backend = backends[renderer];
  if (!backend || !backend.ready) return;
  // Chain renders: texture decodes are async, and messages must apply
  // in arrival order
  glQueue = glQueue.then(async () => {
    const header = await backend.module.render(arrayBuffer);
    // Missing content has no pixel-stream safety net outside split
    // mode: surface it in the bar
    glWarn.textContent = header.unsupported.length
      ? "not rendered: " + header.unsupported.join(", ") : "";
    glWarn.classList.toggle("on", header.unsupported.length > 0);
  }).catch((err) => console.error("client render failed:", err));
}

// -- Scene state and the pausepoint timeline --
function handleMessage(data) {
  if (data.type === "state") {
    lastLiveState = data;
    // During playback the recording owns the presenter; the engine's
    // states keep the badges fresh but never touch the rail.
    if (stageSource !== "playback") presenter.stateChanged(data);
    else applyEnv(data);
  }
  else if (data.type === "move") {
    if (stageSource === "playback") return;   // the video source drives
    if (data.from === null || data.from === undefined) presenter.moveEnded(null);
    else presenter.moveStarted(data.from, data.to, data.back, data.unit);
  }
  else if (data.type === "export_status") handleExportStatus(data);
}

// Scene picker: every Scene class the engine found in the open file, so one
// file's animations are reachable without going back to the landing page.
const sceneButton = document.getElementById("scene-name");
const sceneMenu = document.getElementById("scene-menu");
let sceneNames = [];

function closeSceneMenu() {
  sceneMenu.hidden = true;
  sceneButton.setAttribute("aria-expanded", "false");
}

function renderSceneMenu(current) {
  sceneMenu.replaceChildren();
  for (const name of sceneNames) {
    const option = document.createElement("button");
    option.type = "button";
    option.className = "scene-option";
    option.setAttribute("role", "menuitem");
    option.textContent = name;
    if (name === current) option.setAttribute("aria-current", "true");
    option.onclick = () => {
      closeSceneMenu();
      if (name !== current) send({ type: "switch_scene", scene: name });
    };
    sceneMenu.appendChild(option);
  }
  sceneButton.disabled = sceneNames.length < 2;
  if (sceneButton.disabled) closeSceneMenu();
}

sceneButton.onclick = () => {
  const opening = sceneMenu.hidden;
  sceneMenu.hidden = !opening;
  sceneButton.setAttribute("aria-expanded", String(opening));
};

document.addEventListener("click", (event) => {
  if (!sceneMenu.hidden && !event.target.closest(".scene-picker")) {
    closeSceneMenu();
  }
});
document.addEventListener("keydown", (event) => {
  // Only claim Escape while the menu is open; the canvas owns the keyboard
  // otherwise and forwards keys to the scene.
  if (event.key === "Escape" && !sceneMenu.hidden) {
    closeSceneMenu();
    event.stopPropagation();
  }
}, true);

function applyEnv(state) {
  if (Array.isArray(state.scenes)) sceneNames = state.scenes;
  const presentBtn = document.getElementById("present");
  const presenting = stageSource === "playback" || !!state.present;
  presentBtn.setAttribute("aria-pressed", presenting ? "true" : "false");
  presentBtn.classList.toggle("active", presenting);
  presentBtn.classList.toggle("stale", !!state.present_bundle && !state.present_fresh);
  if (state.scene) {
    document.getElementById("scene-name").textContent = state.scene;
    document.title = state.scene + " — maniml";
    renderSceneMenu(state.scene);
  }
  if (state.file) document.getElementById("file-name").textContent = state.file;
}

// The rail and its presenter live in rail.js so a Node simulation can
// replay message sequences against them (tests/rail_sim.mjs): the
// discipline is a test, not a claim. One author for both modes; the
// chip-click behavior branches on the active source here.
const rail = ManimlRail.create({
  document,
  railEl,
  body: document.body,
  raf: (fn) => requestAnimationFrame(fn),
  env: applyEnv,
  onChipClick: (index) => (stageSource === "playback"
      ? ManimlPresentation.seekCheckpoint(index)
      : send({ type: "chip", index })),
  onFutureChipClick: (unit) => send({ type: "chip_future", unit }),
});
const presenter = rail.presenter;

// -- Toolbar actions --
function pulseKey(key) {
  if (stageSource === "playback") {
    if (key === "ArrowRight") ManimlPresentation.playToNextStop();
    else if (key === "ArrowLeft") ManimlPresentation.playToPreviousStop();
    canvas.focus();
    return;
  }
  send({ type: "key", action: "down", key });
  send({ type: "key", action: "up", key });
  canvas.focus();
}
document.getElementById("previous").onclick = () => pulseKey("ArrowLeft");
document.getElementById("next").onclick = () => pulseKey("ArrowRight");
document.getElementById("restart-scene").onclick = () => {
  send({ type: "restart" });
  canvas.focus();
};
// -- Present-from-video playback --
// The t1-web model hosted in the viewer: the recording (media/<Scene>_present,
// mounted at /present/) replaces the live stage, arrows scrub it forward and
// backward by pausepoints (presentation.js), and the engine is told to send
// nothing at all until playback exits.
const playbackVideo = document.getElementById("playback-video");
let stageSource = "live";       // "live" | "playback"
let lastLiveState = null;       // latest state message from the engine
let presentPending = false;     // a render for Present is in flight

function synthPlaybackState(index) {
  const cps = playbackMeta.checkpoints;
  return {
    type: "state", scene: playbackMeta.scene, scenes: [],
    file: (playbackMeta.source || {}).file || "",
    current: index, count: cps.length,
    lines: cps.map((c) => c.line), units: cps.map((c) => c.chip_unit),
    stops: cps.map((c) => !!c.stop),
    future: [], present: true,
    baked: !!(lastLiveState && lastLiveState.baked),
    present_bundle: true,
    present_fresh: !!(lastLiveState && lastLiveState.present_fresh),
  };
}
let playbackMeta = null;

async function enterPlayback() {
  let meta = null;
  try {
    meta = await (await fetch(scenePrefix + "/present/present.json")).json();
  } catch (err) { /* no bundle */ }
  if (!meta || meta.format !== 1 || !(meta.checkpoints || []).length) {
    showExportStatus("No recording — rendering one", "working");
    presentPending = true;
    send({ type: "export", format: "video" });
    return;
  }
  playbackMeta = meta;
  stageSource = "playback";
  document.body.classList.add("playback");
  send({ type: "mode", geometry: false, pixels: false });  // engine sleeps
  playbackVideo.src = scenePrefix + "/present/scene.mp4";
  const startIndex = Math.min(
    lastLiveState ? Math.max(0, lastLiveState.current) : 0,
    meta.checkpoints.length - 1);
  ManimlPresentation.load(playbackVideo, meta, {
    onUpdate: (index) => presenter.stateChanged(synthPlaybackState(index)),
    onMove: (from, to, back, unit) => {
      if (from !== null && from !== undefined) {
        presenter.moveStarted(from, to, back, unit);
      }
    },
    onRest: (index) => presenter.moveEnded(synthPlaybackState(index)),
  });
  const seekStart = () => ManimlPresentation.seekCheckpoint(startIndex);
  if (playbackVideo.readyState >= 1) seekStart();
  else playbackVideo.addEventListener("loadedmetadata", seekStart, { once: true });
  presenter.stateChanged(synthPlaybackState(startIndex));
}

function exitPlayback() {
  const parkAt = ManimlPresentation.currentIndex();
  ManimlPresentation.unload();
  presenter.moving = false;   // a mid-scrub exit must not wedge the rail
  presenter.pending = null;
  stageSource = "live";
  document.body.classList.remove("playback");
  playbackVideo.removeAttribute("src");
  playbackVideo.load();
  sendRendererMode();                     // the live stream resumes
  send({ type: "chip", index: parkAt }); // park the engine where we stopped
}

document.getElementById("present").onclick = () => {
  if (stageSource === "playback") exitPlayback();
  else void enterPlayback();
  canvas.focus();
};
document.getElementById("export-video").onclick = () => {
  send({ type: "export", format: "video" });
  canvas.focus();
};

const exportPod = document.getElementById("export-pod");
const jobStatus = document.getElementById("job-status");
let exportStatusTimer = null;
function showExportStatus(message, state, linger) {
  clearTimeout(exportStatusTimer);
  jobStatus.textContent = message;
  exportPod.classList.remove("working", "success", "failed");
  exportPod.classList.add("active", state);
  if (linger) {
    exportStatusTimer = setTimeout(() => {
      exportPod.classList.remove("active", "working", "success", "failed");
    }, linger);
  }
}
function handleExportStatus(data) {
  const noun = data.format === "web" ? "Web player" : "Video";
  if (data.status === "running") showExportStatus(noun + " exporting…", "working");
  else if (data.status === "busy") showExportStatus("Export already running", "failed", 4000);
  else if (data.status === "complete") showExportStatus(noun + " saved in media/", "success", 6000);
  else showExportStatus(noun + " export failed", "failed", 6000);
  // A render requested by Present: enter (or re-enter) playback on the
  // fresh recording the render just wrote.
  if (presentPending && data.format === "video"
      && data.status !== "running" && data.status !== "busy") {
    presentPending = false;
    if (data.status === "complete") {
      if (stageSource === "playback") exitPlayback();
      void enterPlayback();
    }
  }
}

// -- Console --
// Toggle-only, and remembered for the tab: stepping a scene prints on every
// arrow key, so anything that opened this by itself would be opening it
// constantly — and never at a worse moment than mid-presentation.
const consolePanel = document.getElementById("console");
const consoleLines = document.getElementById("console-lines");
const consoleEmpty = document.getElementById("console-empty");
const consoleToggle = document.getElementById("console-toggle");
const CONSOLE_KEY = "maniml-console:" + location.host;
const MAX_CONSOLE_LINES = 500;

function setConsole(open) {
  document.body.classList.toggle("console", open);
  consoleToggle.setAttribute("aria-pressed", String(open));
  try { sessionStorage.setItem(CONSOLE_KEY, open ? "1" : "0"); } catch (error) {}
  if (open) consoleLines.scrollTop = consoleLines.scrollHeight;
}

function appendLog(entries, replace) {
  if (replace) consoleLines.replaceChildren();
  for (const entry of entries) {
    const line = document.createElement("div");
    line.className = "line" + (entry.stream === "err" ? " err" : "");
    line.textContent = entry.text;
    consoleLines.appendChild(line);
  }
  while (consoleLines.childElementCount > MAX_CONSOLE_LINES) {
    consoleLines.firstElementChild.remove();
  }
  const hasLines = consoleLines.childElementCount > 0;
  consoleEmpty.hidden = hasLines;
  if (!hasLines) consoleLines.appendChild(consoleEmpty);
  // Follow the tail only when already at it, so reading scrollback is not
  // yanked away by the next line.
  const atEnd = consoleLines.scrollHeight - consoleLines.scrollTop
    - consoleLines.clientHeight < 40;
  if (atEnd) consoleLines.scrollTop = consoleLines.scrollHeight;
}

consoleToggle.onclick = () => {
  setConsole(!document.body.classList.contains("console"));
  canvas.focus();
};
document.getElementById("console-clear").onclick = () => {
  consoleLines.replaceChildren(consoleEmpty);
  consoleEmpty.hidden = false;
  canvas.focus();
};
try {
  if (sessionStorage.getItem(CONSOLE_KEY) === "1") setConsole(true);
} catch (error) {}

// -- Full screen --
// The stage fills the display and the chrome recedes, coming back when the
// pointer nears an edge. The frame itself is a fixed size the engine chose
// (the camera FBO is never resized and the protocol carries no viewport), so
// this upscales rather than re-renders; smooth scaling is the right default,
// which is why image-rendering is left alone.
const REVEAL_EDGE = 88;
const HIDE_DELAY = 2200;
const fullscreenButton = document.getElementById("fullscreen");
const toolbar = document.getElementById("toolbar");
const navbar = document.getElementById("navbar");
let chromeTimer = null;

const inFullscreen = () => !!document.fullscreenElement;

function chromeHeld() {
  // Never yank the chrome out from under a pointer that is using it — the
  // console panel included, since reading it is exactly a still pointer.
  return toolbar.matches(":hover")
    || navbar.matches(":hover")
    || consolePanel.matches(":hover")
    || toolbar.contains(document.activeElement)
    || navbar.contains(document.activeElement)
    || !sceneMenu.hidden
    || !!document.querySelector(".flyover:hover");
}

function showChrome() {
  document.body.classList.add("chrome");
  document.body.classList.remove("idle");
  clearTimeout(chromeTimer);
  chromeTimer = setTimeout(hideChrome, HIDE_DELAY);
}

function hideChrome() {
  if (!inFullscreen()) return;
  if (chromeHeld()) {
    chromeTimer = setTimeout(hideChrome, HIDE_DELAY);
    return;
  }
  document.body.classList.remove("chrome");
  document.body.classList.add("idle");
}

async function toggleFullscreen() {
  try {
    if (inFullscreen()) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen({ navigationUI: "hide" });
  } catch (error) {
    // Denied (no user gesture, or policy): leave the UI as it is.
  }
}

document.addEventListener("fullscreenchange", () => {
  const on = inFullscreen();
  document.body.classList.toggle("fullscreen", on);
  fullscreenButton.setAttribute("aria-pressed", String(on));
  clearTimeout(chromeTimer);
  if (on) showChrome();  // announce the chrome once, then let it recede
  else document.body.classList.remove("chrome", "idle");
  canvas.focus();
});

window.addEventListener("pointermove", (event) => {
  if (!inFullscreen()) return;
  if (event.clientY < REVEAL_EDGE || event.clientY > innerHeight - REVEAL_EDGE) {
    showChrome();
  } else {
    document.body.classList.remove("idle");
    if (document.body.classList.contains("chrome")) showChrome();
  }
});

if (document.fullscreenEnabled) {
  fullscreenButton.hidden = false;
  fullscreenButton.onclick = () => { toggleFullscreen(); canvas.focus(); };
}

// -- Keyboard --
const FORWARDED = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "]);
// Keys handled here rather than by the scene. Tracked so the keyup below does
// not hand the engine a release for a press it never saw.
const claimed = new Set();
function mods(e) { return { shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey }; }
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  // Claim it here, in the one place keys reach the engine, so nothing leaks.
  if ((e.key === "f" || e.key === "F")
      && !e.metaKey && !e.ctrlKey && !e.altKey && document.fullscreenEnabled) {
    e.preventDefault();
    claimed.add(e.key);
    toggleFullscreen();
    return;
  }
  if ((e.key === "c" || e.key === "C") && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    claimed.add(e.key);
    setConsole(!document.body.classList.contains("console"));
    return;
  }
  if (stageSource === "playback" && (FORWARDED.has(e.key) || e.key === "Escape")) {
    // Playback owns navigation: the recording is stepped locally and the
    // engine hears nothing (claimed, so no stray keyup reaches it either).
    e.preventDefault();
    claimed.add(e.key);
    if (e.key === "ArrowRight") ManimlPresentation.playToNextStop();
    else if (e.key === "ArrowLeft") ManimlPresentation.playToPreviousStop();
    else if (e.key === "ArrowUp") ManimlPresentation.stepCheckpoint(1);
    else if (e.key === "ArrowDown") ManimlPresentation.stepCheckpoint(-1);
    else if (e.key === " ") ManimlPresentation.togglePause();
    else if (e.key === "Escape") exitPlayback();
    return;
  }
  if (FORWARDED.has(e.key)) e.preventDefault();
  if (e.key.length === 1 || FORWARDED.has(e.key) || e.key === "Escape") {
    send({ type: "key", action: "down", key: e.key, ...mods(e) });
  }
});
document.addEventListener("keyup", (e) => {
  if (claimed.delete(e.key)) return;
  send({ type: "key", action: "up", key: e.key, ...mods(e) });
});

// -- Pointer: coordinates normalized to the frame, [0,1], y-up.
//    Attached to every canvas — the normalization makes them
//    interchangeable input surfaces --
function norm(e) {
  const r = e.currentTarget.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width,
    y: 1 - (e.clientY - r.top) / r.height,
    dx: e.movementX / r.width,
    dy: -e.movementY / r.height,
  };
}
let moveQueued = null;
function attachPointer(el) {
  el.addEventListener("pointermove", (e) => {
    const p = norm(e);
    if (moveQueued) {  // coalesce moves to one per frame, accumulating deltas
      moveQueued.x = p.x; moveQueued.y = p.y;
      moveQueued.dx += p.dx; moveQueued.dy += p.dy;
      return;
    }
    moveQueued = { type: "pointer", action: "move", buttons: e.buttons, ...mods(e), ...p };
    requestAnimationFrame(() => { send(moveQueued); moveQueued = null; });
  });
  el.addEventListener("pointerdown", (e) => {
    el.setPointerCapture(e.pointerId);
    canvas.focus();
    send({ type: "pointer", action: "down", button: e.button, ...mods(e), ...norm(e) });
  });
  el.addEventListener("pointerup", (e) => {
    send({ type: "pointer", action: "up", button: e.button, ...mods(e), ...norm(e) });
  });
  el.addEventListener("wheel", (e) => {
    e.preventDefault();
    send({ type: "pointer", action: "wheel", wx: e.deltaX / 30, wy: -e.deltaY / 30,
           ...mods(e), ...norm(e) });
  }, { passive: false });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
attachPointer(canvas);
attachPointer(document.getElementById("glview"));
attachPointer(document.getElementById("gpuview"));
</script>
