<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maniml</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/maniml-192.png">
<meta name="theme-color" content="#2b2a2d">
<style>
  :root {
    color-scheme: dark;
    --bg: #2b2a2d;
    --glass: rgba(22, 21, 25, 0.84);
    --glass-solid: #1b1a1e;
    --glass-light: rgba(235, 232, 225, 0.94);
    --line: rgba(255, 255, 255, 0.085);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #ebe7e1;
    --ink: #252428;
    --dim: #969199;
    --accent: #58c4dd;
    --good: #79bf8b;
    --warn: #dfa95c;
    --bad: #da7777;
    --shadow: 0 11px 32px rgba(0, 0, 0, 0.28);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% -15%, rgba(255,255,255,.035), transparent 44%),
      linear-gradient(180deg, rgba(255,255,255,.012), transparent 25%);
  }
  button { font: inherit; }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    gap: 10px; padding: 72px 22px 78px;
  }
  #stage canvas {
    border-radius: 5px;
    box-shadow: 0 18px 55px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.035);
    background: #000;
  }
  #connection-overlay {
    position: absolute; z-index: 10; left: 50%; top: 50%;
    width: min(430px, calc(100% - 42px)); transform: translate(-50%, -50%);
    padding: 24px 25px 22px; border: 1px solid var(--line-strong);
    border-radius: 15px; background: rgba(24, 23, 27, .94);
    box-shadow: 0 20px 65px rgba(0,0,0,.48);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  #connection-overlay[hidden] { display: none; }
  .connection-mark { display: flex; align-items: center; gap: 5px; margin-bottom: 16px; }
  .connection-mark span { width: 7px; height: 7px; border-radius: 50%;
    background: var(--bad); }
  .connection-mark::after { content: ""; width: 28px; height: 1px;
    margin-left: 2px; background: var(--line-strong); }
  #connection-title { margin: 0 0 7px; font: 500 20px/1.2 Georgia,
    "Times New Roman", serif; letter-spacing: .015em; }
  #connection-detail { margin: 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
  .connection-actions { display: flex; gap: 7px; margin-top: 19px; }
  .connection-actions button { padding: 7px 11px; border: 1px solid var(--line);
    border-radius: 8px; background: rgba(255,255,255,.035); color: var(--text);
    cursor: pointer; }
  .connection-actions button:hover, .connection-actions button:focus-visible {
    border-color: var(--line-strong); background: rgba(255,255,255,.07); outline: none; }
  .connection-actions button[hidden] { display: none; }
  #open-from-error { color: var(--dim); background: transparent; }
  #view {
    max-width: 100%; max-height: 100%;
    outline: none; cursor: crosshair;
  }
  .altview { display: none; cursor: crosshair; }
  body.alt #view { display: none; }
  body.alt .altview.current { display: block; max-width: 100%; max-height: 100%; }
  body.alt.compare #view { display: block; max-width: 49.5%; }
  body.alt.compare .altview.current { max-width: 49.5%; }

  /* Plass/Knuth-style chrome: dark glass slugs that recede until used. */
  #toolbar {
    position: fixed; z-index: 20; top: 10px; left: 12px; right: 12px;
    display: flex; justify-content: center; align-items: flex-start;
    gap: 8px; pointer-events: none;
  }
  .pod {
    min-height: 42px; display: flex; align-items: center; gap: 2px;
    padding: 4px 6px; border: 1px solid var(--line); border-radius: 13px;
    background: var(--glass); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    pointer-events: auto; white-space: nowrap;
  }
  .document-slug {
    display: flex; align-items: baseline; min-width: 0; padding: 0 7px 0 10px;
    font-family: Georgia, "Times New Roman", serif; letter-spacing: .055em;
  }
  #file-name { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
  .slug-separator { color: #bb6e70; margin: 0 7px; }
  #scene-name { color: var(--dim); font-size: 12px; letter-spacing: .035em; }
  .icon-button, .fly-action {
    position: relative; display: grid; place-items: center; width: 32px; height: 32px;
    padding: 0; border: 0; border-radius: 9px; background: transparent;
    color: var(--text); opacity: .43; cursor: pointer;
    transition: opacity 140ms ease, color 140ms ease, background 140ms ease,
      transform 140ms ease;
  }
  .icon-button:hover, .icon-button:focus-visible,
  .fly-action:hover, .fly-action:focus-visible { opacity: 1; outline: none; }
  .icon-button:disabled { opacity: .16; cursor: default; background: transparent; }
  .icon-button:hover, .icon-button:focus-visible { background: rgba(255,255,255,.055); }
  .icon-button svg, .fly-action svg {
    width: 17px; height: 17px; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .control-label {
    position: absolute; top: calc(100% + 10px); left: 50%;
    transform: translate(-50%, -3px); padding: 3px 7px; border-radius: 6px;
    background: var(--glass-light); color: var(--ink); box-shadow: 0 7px 20px rgba(0,0,0,.2);
    font-size: 10px; font-weight: 650; letter-spacing: .025em;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 120ms ease, transform 120ms ease, visibility 120ms;
  }
  .icon-button:hover .control-label, .icon-button:focus-visible .control-label,
  .fly-action:hover .control-label, .fly-action:focus-visible .control-label {
    opacity: 1; visibility: visible; transform: translate(-50%, 0);
  }
  .flyover { position: relative; height: 32px; }
  .flyout {
    position: absolute; z-index: 30; top: 0; left: 50%;
    display: flex; gap: 1px; padding: 3px; border-radius: 11px;
    background: var(--glass-light); border: 1px solid rgba(255,255,255,.5);
    box-shadow: 0 10px 28px rgba(0,0,0,.3);
    opacity: 0; visibility: hidden; transform: translateX(-50%) scale(.96);
    transform-origin: center; transition: opacity 120ms ease, transform 120ms ease,
      visibility 120ms; pointer-events: none;
  }
  .flyover:hover .flyout, .flyover:focus-within .flyout {
    opacity: 1; visibility: visible; transform: translateX(-50%) scale(1);
    pointer-events: auto;
  }
  .fly-action { color: var(--ink); opacity: .58; }
  .fly-action[hidden] { display: none; }
  .fly-action:hover, .fly-action:focus-visible { background: rgba(20,19,22,.08); }
  .fly-action .control-label { top: calc(100% + 8px); }
  .transport-pod { padding-inline: 5px; }
  #position {
    min-width: 84px; padding: 0 8px; text-align: center; color: var(--dim);
    font-size: 11px; letter-spacing: .045em; text-transform: uppercase;
  }
  #position strong { color: var(--text); font-weight: 550; }
  #job-status {
    display: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    padding: 0 8px 0 5px; color: var(--dim); font-size: 11px;
  }
  #export-pod.active #job-status { display: block; }
  #export-pod.working .export-icon { color: var(--warn); opacity: 1; }
  #export-pod.success .export-icon { color: var(--good); opacity: 1; }
  #export-pod.failed .export-icon { color: var(--bad); opacity: 1; }
  #renderer-name { padding: 0 7px 0 2px; color: var(--dim); font-size: 11px; }
  .seg.selected { color: #047a92; opacity: 1; background: rgba(88,196,221,.13); }
  .seg.failed { opacity: .24; pointer-events: none; }
  #split.on { color: #047a92; opacity: 1; background: rgba(88,196,221,.13); }
  #glwarn { display: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    color: var(--warn); font-size: 11px; padding: 0 8px 0 2px; }
  #glwarn.on { display: block; }
  #connection-pod { padding: 4px 11px; gap: 7px; color: var(--dim); font-size: 11px; }
  #conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 3px rgba(121,191,139,.08); }
  #conn { max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  body.disconnected #conn-dot { background: var(--bad); box-shadow: 0 0 0 3px rgba(218,119,119,.08); }
  body.disconnected #conn { color: #cf9494; }
  body.disconnected #export-menu, body.disconnected #renderer-menu {
    opacity: .16; pointer-events: none;
  }

  #timeline-shell {
    position: fixed; z-index: 18; left: 50%; bottom: 12px;
    width: min(880px, calc(100% - 32px)); height: 52px;
    transform: translateX(-50%); padding: 5px 11px 5px 13px; gap: 12px;
  }
  #pausepoint-summary { width: 100px; flex: none; line-height: 1.15; }
  #pausepoint-title { display: block; color: var(--text); font-size: 11px; }
  #pausepoint-line { color: var(--dim); font-size: 10px; }
  #chips {
    position: relative; flex: 1; min-width: 0; height: 30px;
    display: flex; align-items: center; gap: 12px; overflow-x: auto;
    padding: 5px 6px; scrollbar-width: none;
  }
  #chips::-webkit-scrollbar { display: none; }
  #chips::before {
    content: ""; position: absolute; left: 7px; right: 7px; top: 50%; height: 1px;
    background: var(--line-strong); transform: translateY(-.5px);
  }
  .chip {
    position: relative; z-index: 1; width: 11px; height: 11px; padding: 0;
    border-radius: 50%; flex: none; background: var(--glass-solid);
    border: 1px solid #5e5a62; cursor: pointer;
    transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
  }
  .chip:hover, .chip:focus-visible { border-color: var(--accent); transform: scale(1.35); outline: none; }
  .chip.past { background: #77727a; border-color: #77727a; }
  .chip.current { background: var(--accent); border-color: var(--accent);
    transform: scale(1.35); box-shadow: 0 0 0 4px rgba(88,196,221,.12); }
  .chip.future { background: var(--glass-solid); border-style: dashed; border-color: #5e5a62; }
  #key-hint { flex: none; color: var(--dim); font-size: 10px; letter-spacing: .025em; }
  .keycap { display: inline-grid; place-items: center; min-width: 19px; height: 19px;
    margin-left: 3px; border: 1px solid var(--line-strong); border-radius: 5px;
    background: rgba(255,255,255,.035); color: var(--text); }

  @media (max-width: 860px) {
    #toolbar { justify-content: flex-start; }
    #connection-pod { margin-left: auto; }
    #renderer-name, #key-hint, #glwarn { display: none !important; }
    #file-name { max-width: 125px; }
    #stage { padding-inline: 12px; }
  }
  @media (max-width: 620px) {
    #toolbar { gap: 5px; left: 7px; right: 7px; }
    .pod { min-height: 38px; border-radius: 12px; padding: 2px 4px; }
    .icon-button, .fly-action { width: 31px; height: 31px; }
    #scene-name, .slug-separator, #connection-pod #conn { display: none; }
    #file-name { max-width: 104px; }
    #position { min-width: 54px; padding-inline: 3px; }
    #position .position-word { display: none; }
    #job-status { max-width: 95px; }
    #timeline-shell { bottom: 8px; width: calc(100% - 14px); }
    #pausepoint-summary { width: 72px; }
    #stage { padding: 62px 8px 72px; }
  }
</style>
</head>
<body class="disconnected">
<div id="stage">
  <canvas id="view" width="1920" height="1080" tabindex="0"></canvas>
  <canvas id="glview" class="altview" title="WebGL2 client render"></canvas>
  <canvas id="gpuview" class="altview" title="WebGPU client render"></canvas>
  <section id="connection-overlay" role="alert" hidden>
    <div class="connection-mark" aria-hidden="true"><span></span><span></span></div>
    <h2 id="connection-title">Can&rsquo;t reach the local engine</h2>
    <p id="connection-detail"></p>
    <div class="connection-actions">
      <button id="retry-connection">Retry</button>
      <button id="open-from-error">Open another scene</button>
      <button id="dismiss-overlay" hidden>Dismiss</button>
    </div>
  </section>
</div>

<header id="toolbar" aria-label="Scene controls">
  <div class="pod file-pod">
    <div class="document-slug" title="Current scene file">
      <span id="file-name">scene.py</span><span class="slug-separator">&middot;</span><span id="scene-name">Scene</span>
    </div>
    <div class="flyover">
      <button id="file-menu" class="icon-button" aria-label="File options" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v9.5a2 2 0 0 1-2 2h-15z"/><path d="M3.5 8.5v-3a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v1"/></svg>
        <span class="control-label">File</span>
      </button>
      <div class="flyout" role="menu" aria-label="File options">
        <button id="open-file" class="fly-action" role="menuitem" aria-label="Open another scene">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="control-label">Open</span>
        </button>
        <button id="restart-scene" class="fly-action" role="menuitem" aria-label="Reload scene from source" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M18.2 16.5A8 8 0 1 1 19.7 9L20 12"/></svg><span class="control-label">Restart</span>
        </button>
      </div>
    </div>
  </div>

  <div class="pod transport-pod">
    <button id="previous" class="icon-button" aria-label="Play previous animation in reverse" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg><span class="control-label">Back&nbsp; ←</span>
    </button>
    <div id="position"><span class="position-word">Pausepoint </span><strong>1 / &mdash;</strong></div>
    <button id="next" class="icon-button" aria-label="Play next animation" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg><span class="control-label">Next&nbsp; →</span>
    </button>
  </div>

  <div id="export-pod" class="pod">
    <div class="flyover">
      <button id="export-menu" class="icon-button export-icon" aria-label="Export options" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/></svg><span class="control-label">Export</span>
      </button>
      <div class="flyout" role="menu" aria-label="Export options">
        <button id="export-video" class="fly-action" role="menuitem" aria-label="Render video" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="12" height="12" rx="2"/><path d="m16 10 4-2v8l-4-2"/></svg><span class="control-label">Video</span>
        </button>
        <button id="export-web" class="fly-action" role="menuitem" aria-label="Export web player" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a13 13 0 0 1 0 16M12 4a13 13 0 0 0 0 16"/></svg><span class="control-label">Web</span>
        </button>
        <button id="export-frame" class="fly-action" role="menuitem" aria-label="Save current frame">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3"/></svg><span class="control-label">Frame</span>
        </button>
      </div>
    </div>
    <span id="job-status" role="status" aria-live="polite"></span>
  </div>

  <div class="pod renderer-pod">
    <div class="flyover">
      <button id="renderer-menu" class="icon-button" aria-label="Renderer options" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 8.5h17M7 6.5h.01M10 6.5h.01"/></svg><span class="control-label">Renderer</span>
      </button>
      <div id="renderers" class="flyout" role="menu" aria-label="Renderer options">
        <button class="fly-action seg selected" data-renderer="pixel" role="menuitem" aria-label="Server pixel renderer"><span>Px</span><span class="control-label">Pixel</span></button>
        <button class="fly-action seg" data-renderer="gl" role="menuitem" aria-label="WebGL2 renderer"><span>GL</span><span class="control-label">WebGL2</span></button>
        <button class="fly-action seg" data-renderer="gpu" role="menuitem" aria-label="WebGPU renderer"><span>GPU</span><span class="control-label">WebGPU</span></button>
        <button id="split" class="fly-action" role="menuitem" aria-label="Compare client renderer with pixel stream">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M12 5v14"/></svg><span class="control-label">Compare</span>
        </button>
      </div>
    </div>
    <span id="renderer-name">Pixel</span>
    <span id="glwarn"></span>
  </div>

  <div id="connection-pod" class="pod" title="Connection to the local ManimLive engine">
    <span id="conn-dot"></span><span id="conn">Connecting</span>
  </div>
</header>

<div id="timeline-shell" class="pod" aria-label="Pausepoint timeline">
  <div id="pausepoint-summary">
    <span id="pausepoint-title">Start</span>
    <span id="pausepoint-line">Scene beginning</span>
  </div>
  <div id="chips" role="list" aria-label="Scene pausepoints"></div>
  <div id="key-hint">play <span class="keycap">←</span><span class="keycap">→</span></div>
</div>
<script src="gl.js"></script>
<script src="webgpu.js"></script>
<script>
"use strict";
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const chipsEl = document.getElementById("chips");
// Keep in sync with WEB_PROTOCOL_VERSION in maniml/web/security.py.
const WEB_PROTOCOL_VERSION = 2;
// A hosted PWA passes the scene's WebSocket
// port as ?ws=; served locally by a scene process, it is port+1
const wsParam = new URLSearchParams(location.search).get("ws");
const wsUrl = wsParam
  ? "ws://127.0.0.1:" + wsParam + "/"
  : "ws://" + location.hostname + ":" + (parseInt(location.port) + 1) + "/";
const viewerTokenKey = "maniml-viewer-token:" + wsUrl;
const loopbackHosts = new Set(["localhost", "127.0.0.1", "[::1]"]);
const isHostedApp = !loopbackHosts.has(location.hostname);
document.getElementById("open-file").onclick = () => requestDesktopBridge();
const fragmentToken = new URLSearchParams(location.hash.slice(1)).get("token");
if (fragmentToken && !isHostedApp) {
  sessionStorage.setItem(viewerTokenKey, fragmentToken);
}
if (fragmentToken) {
  history.replaceState(null, "", location.pathname + location.search);
}
const viewerToken = fragmentToken
  || (!isHostedApp && sessionStorage.getItem(viewerTokenKey));
let ws = null;
let protocolMismatch = false;
let reconnectCount = 0;
let reconnectTimer = null;
const MAX_RECONNECTS = 3;
const connectionOverlay = document.getElementById("connection-overlay");
const connectionTitle = document.getElementById("connection-title");
const connectionDetail = document.getElementById("connection-detail");

function showOverlay(title, detail, { canRetry = false, canDismiss = false } = {}) {
  connectionTitle.textContent = title;
  connectionDetail.textContent = detail;
  document.getElementById("retry-connection").hidden = !canRetry;
  document.getElementById("dismiss-overlay").hidden = !canDismiss;
  connectionOverlay.hidden = false;
}

function showConnectionIssue(title, detail, canRetry) {
  document.body.classList.add("disconnected");
  showOverlay(title, detail, { canRetry });
}

function hideConnectionIssue() {
  connectionOverlay.hidden = true;
}

// Custom-scheme navigation fails silently when no application claims the
// scheme, so an uninstalled desktop app made Open look like a dead control.
// Losing visibility means a handler took over; still being visible after the
// timeout means the link went nowhere.
const BRIDGE_TIMEOUT = 2500;
let bridgeTimer = null;

function requestDesktopBridge() {
  clearTimeout(bridgeTimer);
  window.location.href = "maniml://open";
  bridgeTimer = setTimeout(() => {
    bridgeTimer = null;
    if (document.visibilityState === "hidden") return;
    // Deliberately not showConnectionIssue: this scene's own connection is
    // unaffected, so it must not be marked disconnected. Dismissable, because
    // the viewer behind it is still fully usable.
    showOverlay(
      "Local app not installed",
      "macOS has no handler for maniml:// links, so no file dialog opened. "
        + "Install the ManimLive local app from the ManimLive start page, "
        + "then try Open again.",
      { canDismiss: true }
    );
  }, BRIDGE_TIMEOUT);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    clearTimeout(bridgeTimer);
    bridgeTimer = null;
  }
});

function primeLoopbackPermission() {
  if (!isHostedApp || !wsParam) return;
  const httpPort = Number(wsParam) - 1;
  if (!Number.isInteger(httpPort) || httpPort < 1024 || httpPort > 65534) return;
  // Chrome 142+ gates public-to-loopback requests behind Local Network
  // Access, and Chrome 147+ applies it to WebSockets. A harmless, token-free
  // request gives the browser a chance to ask before the socket opens. Older
  // browsers ignore targetAddressSpace; older engines can serve this asset.
  try {
    const request = new Request(
      `http://127.0.0.1:${httpPort}/manifest.webmanifest?probe=${Date.now()}`,
      { method: "HEAD", mode: "no-cors", cache: "no-store",
        targetAddressSpace: "loopback" }
    );
    fetch(request).catch(() => {});
  } catch (error) {
    // WebSocket fallback below preserves compatibility with browsers that do
    // not yet understand the Local Network Access request option.
  }
}

function scheduleReconnect() {
  reconnectCount += 1;
  if (reconnectCount >= MAX_RECONNECTS) {
    document.getElementById("conn").textContent = isHostedApp
      ? "Local access needed" : "Engine unavailable";
    const detail = isHostedApp
      ? `Open this scene in Chrome or the installed ManimLive app. Allow Local network access for ${location.host} when asked, then retry.`
      : "The local viewer server is no longer responding. Retry, or reopen the scene to start a fresh session.";
    showConnectionIssue(
      "Can’t reach the local engine",
      detail,
      true
    );
    return;
  }
  document.getElementById("conn").textContent = "Reconnecting";
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, 700 * reconnectCount);
}

function connect(manualRetry = false) {
  clearTimeout(reconnectTimer);
  if (manualRetry) {
    reconnectCount = 0;
    hideConnectionIssue();
  }
  if (!viewerToken) {
    document.getElementById("conn").textContent = "viewer authorization missing";
    showConnectionIssue(
      "This viewer link has expired",
      "Open the scene again from ManimLive or Finder to create a fresh, private viewer session.",
      false
    );
    return;
  }
  document.body.classList.add("disconnected");
  document.getElementById("conn").textContent = isHostedApp
    ? "Requesting local access" : "Connecting";
  primeLoopbackPermission();
  try {
    ws = new WebSocket(wsUrl);
  } catch (error) {
    scheduleReconnect();
    return;
  }
  ws.binaryType = "blob";
  ws.onopen = () => {
    document.getElementById("conn").textContent = "Authorizing";
    ws.send(JSON.stringify({ type: "authenticate", token: viewerToken }));
  };
  ws.onclose = (event) => {
    document.body.classList.add("disconnected");
    if (protocolMismatch) return;
    if (event.code === 1008) {
      if (!isHostedApp) sessionStorage.removeItem(viewerTokenKey);
      document.getElementById("conn").textContent = "viewer authorization expired";
      showConnectionIssue(
        "This viewer link has expired",
        "Open the scene again from ManimLive or Finder to create a fresh, private viewer session.",
        false
      );
      return;
    }
    scheduleReconnect();
  };
  ws.onerror = () => {};
  ws.onmessage = (e) => {
    if (typeof e.data === "string") {
      const data = JSON.parse(e.data);
      if (data.type === "authenticated") {
        if (data.protocol !== WEB_PROTOCOL_VERSION) {
          protocolMismatch = true;
          document.body.classList.add("disconnected");
          document.getElementById("conn").textContent =
            "engine update required";
          showConnectionIssue(
            "Engine update required",
            "The installed Python engine is older than this interface. Update ManimLive, then open the scene again.",
            false
          );
          ws.close(1000, "protocol mismatch");
          return;
        }
        reconnectCount = 0;
        document.body.classList.remove("disconnected");
        document.getElementById("conn").textContent = "Connected";
        hideConnectionIssue();
        applyCapabilities(data.capabilities || []);
        canvas.focus();
        // WebGPU is the live viewer's primary path.  Initialize it only after
        // the engine is authenticated, then request the geometry snapshot.
        // selectRenderer falls back visibly to Pixel on older browsers.
        if (renderer !== "pixel") {
          const segment = document.querySelector(
            `#renderers .seg[data-renderer="${renderer}"]`
          );
          void selectRenderer(renderer, segment);
        }
      } else {
        handleMessage(data);
      }
    }
    else { handleFrame(e.data); }
  };
}
connect();

document.getElementById("retry-connection").onclick = () => connect(true);
document.getElementById("dismiss-overlay").onclick = () => hideConnectionIssue();
document.getElementById("open-from-error").onclick = () => requestDesktopBridge();

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function applyCapabilities(values) {
  const capabilities = new Set(values);
  document.getElementById("restart-scene").hidden = !capabilities.has("restart");
  document.getElementById("export-video").hidden = !capabilities.has("export");
  document.getElementById("export-web").hidden = !capabilities.has("export");
}

// -- Frames (1 header byte: 0x01 JPEG, 0x02 PNG; image is GL bottom-up.
//    0x03 is a geometry payload, routed to the selected client renderer) --
let drawing = false, pendingBlob = null;
async function handleFrame(blob) {
  const head = new Uint8Array(await blob.slice(0, 1).arrayBuffer())[0];
  if (head === 3) { handleGeometry(await blob.arrayBuffer()); return; }
  if (drawing) { pendingBlob = blob; return; }  // coalesce to latest
  drawing = true;
  try {
    const bmp = await createImageBitmap(blob.slice(1));
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
      canvas.width = bmp.width; canvas.height = bmp.height;
    }
    ctx.save();
    ctx.translate(0, canvas.height);
    ctx.scale(1, -1);
    ctx.drawImage(bmp, 0, 0);
    ctx.restore();
    bmp.close();
  } finally {
    drawing = false;
    if (pendingBlob) { const b = pendingBlob; pendingBlob = null; handleFrame(b); }
  }
}

// -- Client renderers: Pixel is the server stream; WebGL2 and WebGPU
//    render geometry payloads in the browser. "split" shows the pixel
//    stream beside the client render for comparison. --
const glWarn = document.getElementById("glwarn");
const splitEl = document.getElementById("split");
const backends = {
  gl: { module: ManimlGL, canvas: document.getElementById("glview"),
        ready: false },
  gpu: { module: ManimlWGPU, canvas: document.getElementById("gpuview"),
         ready: false },
};
const DEFAULT_RENDERER = "gpu";
let renderer = DEFAULT_RENDERER;
let split = false;

function applyRendererUI() {
  document.body.classList.toggle("alt", renderer !== "pixel");
  document.body.classList.toggle("compare", renderer !== "pixel" && split);
  splitEl.classList.toggle("on", split);
  for (const seg of document.querySelectorAll("#renderers .seg")) {
    seg.classList.toggle("selected", seg.dataset.renderer === renderer);
  }
  for (const [name, backend] of Object.entries(backends)) {
    backend.canvas.classList.toggle("current", renderer === name);
  }
  document.getElementById("renderer-name").textContent = {
    pixel: "Pixel", gl: "WebGL2", gpu: "WebGPU",
  }[renderer];
  if (renderer === "pixel") glWarn.classList.remove("on");
}

function sendRendererMode() {
  send({ type: "mode", geometry: renderer !== "pixel",
         pixels: renderer === "pixel" || split });
  if (renderer !== "pixel") send({ type: "geometry_request" });
}

async function selectRenderer(name, seg) {
  if (name !== "pixel") {
    const backend = backends[name];
    try {
      if (!backend.ready) {
        await backend.module.init(backend.canvas);
        // Evicted a batch the server still considers sent: ask for a
        // full resend on the next payload
        backend.module.onCacheMiss = () => send({ type: "geometry_reset" });
        backend.ready = true;
      }
    } catch (err) {
      if (seg) {
        seg.classList.add("failed");
        seg.title = "unavailable: " + err.message;
      }
      renderer = "pixel";
      applyRendererUI();
      glWarn.textContent = "WebGPU unavailable; using Pixel: " + err.message;
      glWarn.classList.add("on");
      sendRendererMode();
      return false;
    }
  }
  renderer = name;
  applyRendererUI();
  sendRendererMode();
  return true;
}

for (const seg of document.querySelectorAll("#renderers .seg")) {
  seg.onclick = () => selectRenderer(seg.dataset.renderer, seg);
}
applyRendererUI();
splitEl.onclick = () => {
  split = !split;
  applyRendererUI();
  sendRendererMode();
};

let glQueue = Promise.resolve();
function handleGeometry(arrayBuffer) {
  const backend = backends[renderer];
  if (!backend || !backend.ready) return;
  // Chain renders: texture decodes are async, and messages must apply
  // in arrival order
  glQueue = glQueue.then(async () => {
    const header = await backend.module.render(arrayBuffer);
    // Missing content has no pixel-stream safety net outside split
    // mode: surface it in the bar
    glWarn.textContent = header.unsupported.length
      ? "not rendered: " + header.unsupported.join(", ") : "";
    glWarn.classList.toggle("on", header.unsupported.length > 0);
  }).catch((err) => console.error("client render failed:", err));
}

// -- Scene state and the pausepoint timeline --
function handleMessage(data) {
  if (data.type === "state") handleState(data);
  else if (data.type === "export_status") handleExportStatus(data);
}

function handleState(state) {
  if (state.scene) {
    document.getElementById("scene-name").textContent = state.scene;
    document.title = state.scene + " — maniml";
  }
  if (state.file) document.getElementById("file-name").textContent = state.file;

  const future = state.future || [];
  const total = state.count + future.length;
  const current = Math.max(0, state.current);
  document.querySelector("#position strong").textContent =
    (current + 1) + " / " + Math.max(1, total);
  document.getElementById("previous").disabled = current <= 0;
  document.getElementById("next").disabled = current >= total - 1;
  const currentLine = state.lines[current];
  document.getElementById("pausepoint-title").textContent =
    current === 0 ? "Start" : "Pausepoint " + current;
  document.getElementById("pausepoint-line").textContent = currentLine
    ? "Source line " + currentLine : "Scene beginning";

  chipsEl.replaceChildren();
  for (let i = 0; i < state.count; i++) {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip" + (i < current ? " past" : "")
      + (i === current ? " current" : "");
    chip.title = i === 0 ? "Start" : "Pausepoint " + i
      + (state.lines[i] ? " · line " + state.lines[i] : "");
    chip.setAttribute("role", "listitem");
    chip.setAttribute("aria-label", chip.title);
    if (i === current) chip.setAttribute("aria-current", "step");
    chip.onclick = () => send({ type: "chip", index: i });
    chipsEl.appendChild(chip);
  }
  for (let i = 0; i < future.length; i++) {
    const unit = future[i];
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip future";
    chip.title = "Pausepoint " + (state.count + i) + " · run to line " + unit.line;
    chip.setAttribute("role", "listitem");
    chip.setAttribute("aria-label", chip.title);
    chip.onclick = () => send({ type: "chip_future", unit: unit.unit });
    chipsEl.appendChild(chip);
  }
  requestAnimationFrame(() => {
    const active = chipsEl.querySelector(".current");
    if (active) active.scrollIntoView({ block: "nearest", inline: "center" });
  });
}

// -- Toolbar actions --
function pulseKey(key) {
  send({ type: "key", action: "down", key });
  send({ type: "key", action: "up", key });
  canvas.focus();
}
document.getElementById("previous").onclick = () => pulseKey("ArrowLeft");
document.getElementById("next").onclick = () => pulseKey("ArrowRight");
document.getElementById("restart-scene").onclick = () => {
  send({ type: "restart" });
  canvas.focus();
};
document.getElementById("export-video").onclick = () => {
  send({ type: "export", format: "video" });
  canvas.focus();
};
document.getElementById("export-web").onclick = () => {
  send({ type: "export", format: "web" });
  canvas.focus();
};

const exportPod = document.getElementById("export-pod");
const jobStatus = document.getElementById("job-status");
let exportStatusTimer = null;
function showExportStatus(message, state, linger) {
  clearTimeout(exportStatusTimer);
  jobStatus.textContent = message;
  exportPod.classList.remove("working", "success", "failed");
  exportPod.classList.add("active", state);
  if (linger) {
    exportStatusTimer = setTimeout(() => {
      exportPod.classList.remove("active", "working", "success", "failed");
    }, linger);
  }
}
function handleExportStatus(data) {
  const noun = data.format === "web" ? "Web player" : "Video";
  if (data.status === "running") showExportStatus(noun + " exporting…", "working");
  else if (data.status === "busy") showExportStatus("Export already running", "failed", 4000);
  else if (data.status === "complete") showExportStatus(noun + " saved in media/", "success", 6000);
  else showExportStatus(noun + " export failed", "failed", 6000);
}
document.getElementById("export-frame").onclick = () => {
  const source = renderer === "pixel" ? canvas : backends[renderer].canvas;
  source.toBlob((blob) => {
    if (!blob) {
      showExportStatus("Frame export failed", "failed", 5000);
      return;
    }
    const link = document.createElement("a");
    link.download = (document.getElementById("scene-name").textContent || "scene")
      .replace(/[^A-Za-z0-9._-]+/g, "-") + "-frame.png";
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    showExportStatus("Frame saved", "success", 4000);
  }, "image/png");
  canvas.focus();
};

// -- Keyboard --
const FORWARDED = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "]);
function mods(e) { return { shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey }; }
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (FORWARDED.has(e.key)) e.preventDefault();
  if (e.key.length === 1 || FORWARDED.has(e.key) || e.key === "Escape") {
    send({ type: "key", action: "down", key: e.key, ...mods(e) });
  }
});
document.addEventListener("keyup", (e) => {
  send({ type: "key", action: "up", key: e.key, ...mods(e) });
});

// -- Pointer: coordinates normalized to the frame, [0,1], y-up.
//    Attached to every canvas — the normalization makes them
//    interchangeable input surfaces --
function norm(e) {
  const r = e.currentTarget.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width,
    y: 1 - (e.clientY - r.top) / r.height,
    dx: e.movementX / r.width,
    dy: -e.movementY / r.height,
  };
}
let moveQueued = null;
function attachPointer(el) {
  el.addEventListener("pointermove", (e) => {
    const p = norm(e);
    if (moveQueued) {  // coalesce moves to one per frame, accumulating deltas
      moveQueued.x = p.x; moveQueued.y = p.y;
      moveQueued.dx += p.dx; moveQueued.dy += p.dy;
      return;
    }
    moveQueued = { type: "pointer", action: "move", buttons: e.buttons, ...mods(e), ...p };
    requestAnimationFrame(() => { send(moveQueued); moveQueued = null; });
  });
  el.addEventListener("pointerdown", (e) => {
    el.setPointerCapture(e.pointerId);
    canvas.focus();
    send({ type: "pointer", action: "down", button: e.button, ...mods(e), ...norm(e) });
  });
  el.addEventListener("pointerup", (e) => {
    send({ type: "pointer", action: "up", button: e.button, ...mods(e), ...norm(e) });
  });
  el.addEventListener("wheel", (e) => {
    e.preventDefault();
    send({ type: "pointer", action: "wheel", wx: e.deltaX / 30, wy: -e.deltaY / 30,
           ...mods(e), ...norm(e) });
  }, { passive: false });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
attachPointer(canvas);
attachPointer(document.getElementById("glview"));
attachPointer(document.getElementById("gpuview"));
</script>
</body>
