<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maniml</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #111; color: #bbb;
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0 0 44px 0;
    display: flex; align-items: center; justify-content: center;
  }
  #view {
    max-width: 100%; max-height: 100%;
    outline: none; cursor: crosshair;
  }
  .altview { display: none; cursor: crosshair; }
  body.gl-active #stage { gap: 8px; }
  body.gl-active #view { max-width: 49%; }
  body.gl-active .altview.current { display: block; max-width: 49%; max-height: 100%; }
  body.gl-solo #view { display: none; }
  body.gl-solo .altview.current { max-width: 100%; }
  .rbtn {
    color: #777; border: 1px solid #333; border-radius: 4px;
    padding: 2px 8px; cursor: pointer; user-select: none; flex: none;
  }
  .rbtn:hover { border-color: #666; }
  .rbtn.active { color: #ddd; border-color: #7a7; }
  .rbtn.solo { color: #fff; border-color: #4c4; background: #1d2a1d; }
  #glwarn { display: none; color: #d90; white-space: nowrap; }
  body.gl-solo #glwarn.on { display: block; }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    display: flex; align-items: center; gap: 12px; padding: 0 14px;
    box-sizing: border-box; background: #181818; border-top: 1px solid #262626;
  }
  #conn { display: none; color: #d33; flex: none; white-space: nowrap; }
  body.disconnected #conn { display: block; }
  #chips { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow-x: auto; }
  .chip {
    width: 11px; height: 11px; border-radius: 50%; flex: none;
    background: #333; border: 1px solid #555; cursor: pointer;
  }
  .chip:hover { border-color: #999; }
  .chip.current { background: #e8e8e8; border-color: #e8e8e8; }
  .chip.future { background: none; border-style: dashed; border-color: #444; }
  .chip.future:hover { border-color: #999; }
  #hint { margin-left: auto; color: #555; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="view" width="1920" height="1080" tabindex="0"></canvas>
  <canvas id="glview" class="altview" title="WebGL2 client render"></canvas>
  <canvas id="gpuview" class="altview" title="WebGPU client render"></canvas>
</div>
<div id="bar">
  <div id="conn">reconnecting&hellip;</div>
  <div id="chips"></div>
  <div id="glwarn"></div>
  <div id="glbtn" class="rbtn" title="WebGL2 backend — cycle: off / side-by-side compare / solo">GL</div>
  <div id="gpubtn" class="rbtn" title="WebGPU backend — cycle: off / side-by-side compare / solo">WGPU</div>
  <div id="hint">&larr; &rarr; run &nbsp; &uarr; &darr; jump &nbsp; click to inspect &amp; drag</div>
</div>
<script src="gl.js"></script>
<script src="webgpu.js"></script>
<script>
"use strict";
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const chipsEl = document.getElementById("chips");
const wsUrl = "ws://" + location.hostname + ":" + (parseInt(location.port) + 1) + "/";
let ws = null;

function connect() {
  ws = new WebSocket(wsUrl);
  ws.binaryType = "blob";
  ws.onopen = () => {
    document.body.classList.remove("disconnected");
    canvas.focus();
    if (activeBackend) sendGlMode();
  };
  ws.onclose = () => { document.body.classList.add("disconnected"); setTimeout(connect, 1000); };
  ws.onmessage = (e) => {
    if (typeof e.data === "string") { handleState(JSON.parse(e.data)); }
    else { handleFrame(e.data); }
  };
}
connect();

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// -- Frames (1 header byte: 0x01 JPEG, 0x02 PNG; image is GL bottom-up.
//    0x03 is a Stage-2 geometry snapshot, routed to the WebGL2 renderer) --
let drawing = false, pendingBlob = null;
async function handleFrame(blob) {
  const head = new Uint8Array(await blob.slice(0, 1).arrayBuffer())[0];
  if (head === 3) { handleGeometry(await blob.arrayBuffer()); return; }
  if (drawing) { pendingBlob = blob; return; }  // coalesce to latest
  drawing = true;
  try {
    const bmp = await createImageBitmap(blob.slice(1));
    if (canvas.width !== bmp.width || canvas.height !== bmp.height) {
      canvas.width = bmp.width; canvas.height = bmp.height;
    }
    ctx.save();
    ctx.translate(0, canvas.height);
    ctx.scale(1, -1);
    ctx.drawImage(bmp, 0, 0);
    ctx.restore();
    bmp.close();
  } finally {
    drawing = false;
    if (pendingBlob) { const b = pendingBlob; pendingBlob = null; handleFrame(b); }
  }
}

// -- Stage-2: client-side rendering, two backends (WebGL2 and WebGPU).
//    Each button cycles: off -> compare (side-by-side) -> solo (the
//    client render is the viewer; the pixel stream stops entirely).
//    Backends are mutually exclusive. --
const glWarn = document.getElementById("glwarn");

function makeBackend(buttonId, canvasId, module, label) {
  return {
    button: document.getElementById(buttonId),
    canvas: document.getElementById(canvasId),
    module, label, ready: false, state: "off",
  };
}
const backends = [
  makeBackend("glbtn", "glview", ManimlGL, "GL"),
  makeBackend("gpubtn", "gpuview", ManimlWGPU, "WGPU"),
];
let activeBackend = null;

function refreshBackendUI() {
  const state = activeBackend ? activeBackend.state : "off";
  document.body.classList.toggle("gl-active", state !== "off");
  document.body.classList.toggle("gl-solo", state === "solo");
  for (const backend of backends) {
    const on = backend === activeBackend && backend.state !== "off";
    backend.canvas.classList.toggle("current", on);
    backend.button.classList.toggle("active", on);
    backend.button.classList.toggle(
      "solo", on && backend.state === "solo");
    backend.button.textContent = on && backend.state === "solo"
      ? backend.label + " solo" : backend.label;
  }
}

function sendGlMode() {
  const state = activeBackend ? activeBackend.state : "off";
  send({ type: "mode", geometry: state !== "off",
         pixels: state !== "solo" });
  if (state !== "off") send({ type: "geometry_request" });
}

for (const backend of backends) {
  backend.button.onclick = async () => {
    if (activeBackend && activeBackend !== backend) {
      activeBackend.state = "off";  // backends are mutually exclusive
    }
    if (backend.state === "off") {
      try {
        if (!backend.ready) {
          await backend.module.init(backend.canvas);
          // Evicted a batch the server still considers sent: ask for
          // a full resend on the next payload
          backend.module.onCacheMiss =
            () => send({ type: "geometry_reset" });
          backend.ready = true;
        }
      } catch (err) {
        backend.button.textContent = backend.label + " ✗";
        backend.button.title = "renderer unavailable: " + err.message;
        return;
      }
      backend.state = "compare";
    } else if (backend.state === "compare") {
      backend.state = "solo";
    } else {
      backend.state = "off";
    }
    activeBackend = backend.state === "off" ? null : backend;
    refreshBackendUI();
    sendGlMode();
  };
}
let glQueue = Promise.resolve();
function handleGeometry(arrayBuffer) {
  const backend = activeBackend;
  if (!backend || !backend.ready) return;
  // Chain renders: texture decodes are async, and messages must apply
  // in arrival order
  glQueue = glQueue.then(async () => {
    const header = await backend.module.render(arrayBuffer);
    // In solo mode, missing content has no pixel-stream safety net:
    // surface it loudly in the bar
    glWarn.textContent = header.unsupported.length
      ? "not rendered: " + header.unsupported.join(", ") : "";
    glWarn.classList.toggle("on", header.unsupported.length > 0);
  }).catch((err) => console.error("client render failed:", err));
}

// -- Checkpoint chips --
function handleState(state) {
  if (state.type !== "state") return;
  chipsEl.replaceChildren();
  for (let i = 0; i < state.count; i++) {
    const chip = document.createElement("div");
    chip.className = "chip" + (i === state.current ? " current" : "");
    chip.title = state.lines[i] ? "line " + state.lines[i] : "start";
    chip.onclick = () => send({ type: "chip", index: i });
    chipsEl.appendChild(chip);
  }
  for (const unit of state.future || []) {
    const chip = document.createElement("div");
    chip.className = "chip future";
    chip.title = "run to line " + unit.line;
    chip.onclick = () => send({ type: "chip_future", unit: unit.unit });
    chipsEl.appendChild(chip);
  }
}

// -- Keyboard --
const FORWARDED = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "]);
function mods(e) { return { shift: e.shiftKey, ctrl: e.ctrlKey, alt: e.altKey, meta: e.metaKey }; }
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  if (FORWARDED.has(e.key)) e.preventDefault();
  if (e.key.length === 1 || FORWARDED.has(e.key) || e.key === "Escape") {
    send({ type: "key", action: "down", key: e.key, ...mods(e) });
  }
});
document.addEventListener("keyup", (e) => {
  send({ type: "key", action: "up", key: e.key, ...mods(e) });
});

// -- Pointer: coordinates normalized to the frame, [0,1], y-up.
//    Attached to both canvases (pixel stream and GL panel) — the
//    normalization makes them interchangeable input surfaces --
function norm(e) {
  const r = e.currentTarget.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) / r.width,
    y: 1 - (e.clientY - r.top) / r.height,
    dx: e.movementX / r.width,
    dy: -e.movementY / r.height,
  };
}
let moveQueued = null;
function attachPointer(el) {
  el.addEventListener("pointermove", (e) => {
    const p = norm(e);
    if (moveQueued) {  // coalesce moves to one per frame, accumulating deltas
      moveQueued.x = p.x; moveQueued.y = p.y;
      moveQueued.dx += p.dx; moveQueued.dy += p.dy;
      return;
    }
    moveQueued = { type: "pointer", action: "move", buttons: e.buttons, ...mods(e), ...p };
    requestAnimationFrame(() => { send(moveQueued); moveQueued = null; });
  });
  el.addEventListener("pointerdown", (e) => {
    el.setPointerCapture(e.pointerId);
    canvas.focus();
    send({ type: "pointer", action: "down", button: e.button, ...mods(e), ...norm(e) });
  });
  el.addEventListener("pointerup", (e) => {
    send({ type: "pointer", action: "up", button: e.button, ...mods(e), ...norm(e) });
  });
  el.addEventListener("wheel", (e) => {
    e.preventDefault();
    send({ type: "pointer", action: "wheel", wx: e.deltaX / 30, wy: -e.deltaY / 30,
           ...mods(e), ...norm(e) });
  }, { passive: false });
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
attachPointer(canvas);
attachPointer(document.getElementById("glview"));
attachPointer(document.getElementById("gpuview"));
</script>
</body>
</html>
