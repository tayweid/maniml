<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maniml presentation</title>
<!-- The standalone presenter: this file ships as index.html inside a
     media/<Scene>_present/ bundle (web/present_bundle.py), beside
     presentation.js, present_meta.js, and scene.mp4. It opens from disk
     (file:// has no fetch, which is why the table arrives as a script)
     and reaches nothing — no socket, no engine — so it can sit on any
     static host. Deliberately standalone, like the baked player: it
     shares no stylesheet with the viewer chrome. -->
<style>
  :root {
    color-scheme: dark;
    --bg: #101014; --panel: #17171c; --line: #26262e;
    --text: #d6d6dc; --dim: #74747e; --accent: #58C4DD;
  }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0 0 48px 0;
    display: flex; align-items: center; justify-content: center;
    padding: 10px; box-sizing: border-box;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #stage video {
    max-width: 100%; max-height: 100%; border-radius: 6px;
    pointer-events: none;   /* taps land on the stage, not the controls */
  }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    box-sizing: border-box; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  #scene-name { font-weight: 600; white-space: nowrap; }
  #chips {
    display: flex; align-items: center; gap: 7px;
    overflow-x: auto; padding: 4px 0;
  }
  .chip {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    background: var(--line); border: 1px solid #3a3a44; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.passed { background: #3a3a44; }
  .chip.current { background: var(--accent); border-color: var(--accent); }
  body.moving .chip.current { background: #3a3a44; border-color: var(--accent); }
  #status { margin-left: auto; color: var(--dim); font-size: 12px;
            white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"><video id="video" src="scene.mp4" preload="auto" playsinline></video></div>
<div id="bar">
  <div id="scene-name"></div>
  <div id="chips"></div>
  <div id="status"></div>
</div>
<script src="presentation.js"></script>
<script src="present_meta.js"></script>
<script>
"use strict";
(() => {
  const meta = window.MANIML_PRESENT;
  const video = document.getElementById("video");
  const stage = document.getElementById("stage");
  const chipsEl = document.getElementById("chips");
  const statusEl = document.getElementById("status");

  document.title = meta.scene;
  document.getElementById("scene-name").textContent = meta.scene;

  // Students think in pausepoints; the rail is one chip per stop.
  const stops = meta.checkpoints.filter((cp) => cp.stop);

  function stopAtOrBefore(index) {
    let at = 0;
    stops.forEach((cp, k) => { if (cp.index <= index) at = k; });
    return at;
  }

  function refresh(index) {
    const at = stopAtOrBefore(index);
    chipsEl.replaceChildren();
    stops.forEach((cp, k) => {
      const chip = document.createElement("div");
      chip.className = "chip" + (k < at ? " passed" : "")
        + (k === at ? " current" : "");
      chip.title = cp.name || ("beat " + (k + 1));
      chip.onclick = (e) => {
        e.stopPropagation();
        ManimlPresentation.seekCheckpoint(cp.index);
      };
      chipsEl.appendChild(chip);
    });
    const name = stops[at].name;
    statusEl.textContent = (at + 1) + " / " + stops.length
      + (name ? " — " + name : "");
    chipsEl.children[at] && chipsEl.children[at].scrollIntoView(
      { block: "nearest", inline: "nearest" });
  }

  ManimlPresentation.load(video, meta, {
    onUpdate: (i) => { document.body.classList.remove("moving"); refresh(i); },
    onMove: () => document.body.classList.add("moving"),
    onRest: (i) => { document.body.classList.remove("moving"); refresh(i); },
  });

  // Click / tap: the left fifth steps back, the rest advances — the
  // slide-clicker model, workable one-handed on a phone.
  stage.addEventListener("click", (e) => {
    const back = e.clientX < stage.clientWidth / 5;
    if (back) ManimlPresentation.playToPreviousStop();
    else ManimlPresentation.playToNextStop();
  });

  document.addEventListener("keydown", (e) => {
    const forward = ["ArrowRight", " ", "Enter", "PageDown"];
    const backward = ["ArrowLeft", "PageUp"];
    if (forward.includes(e.key)) {
      e.preventDefault();
      ManimlPresentation.playToNextStop();
    } else if (backward.includes(e.key)) {
      e.preventDefault();
      ManimlPresentation.playToPreviousStop();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      ManimlPresentation.stepCheckpoint(1);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      ManimlPresentation.stepCheckpoint(-1);
    } else if (e.key === "Home") {
      e.preventDefault();
      ManimlPresentation.seekCheckpoint(0);
    } else if (e.key === "End") {
      e.preventDefault();
      ManimlPresentation.seekCheckpoint(
        meta.checkpoints[meta.checkpoints.length - 1].index);
    }
  });

  refresh(0);
})();
</script>
</body>
</html>
