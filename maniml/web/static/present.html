<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maniml presentation</title>
<!-- The standalone presenter: this file ships as index.html inside a
     media/<Scene>_present/ bundle (web/present_bundle.py), beside
     presentation.js, rail.js, present_meta.js, and scene.mp4. It opens
     from disk (file:// has no fetch, which is why the table arrives as
     a script) and reaches nothing — no socket, no engine — so it can
     sit on any static host.

     The bar is the viewer's presenter bar: same markup, same rail.js,
     and the pod/rail styles COPIED below rather than linked — a bundle
     must stay a self-contained folder with no dependency on the app it
     came from, so the shared stylesheet is deliberately not referenced.
     When the viewer's bar moves, re-copy the subset here. -->
<style>
  /* ---- tokens and canvas (copied subset of the app shell) ---- */
  :root {
    color-scheme: dark;
    --bg: #2b2a2d;
    --glass: color-mix(in srgb, #17161a 80%, transparent);
    --glass-solid: #201f23;
    --line: rgba(255, 255, 255, 0.085);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #ebe7e1;
    --ink: #252428;
    --dim: #969199;
    --accent: #58c4dd;
    --frame: #17161a;
    --shadow: 0 11px 32px rgba(0, 0, 0, 0.28);
    --glass-light: rgba(235, 232, 225, 0.94);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% -15%, rgba(255,255,255,.035), transparent 44%),
      linear-gradient(180deg, rgba(255,255,255,.012), transparent 25%);
  }
  button { font: inherit; }

  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 14px 14px 72px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #stage video {
    max-width: 100%; max-height: 100%; border-radius: 8px;
    box-shadow: var(--shadow);
    pointer-events: none;   /* taps land on the stage, not the controls */
  }

  /* ---- the glass pods (copied subset) ---- */
  .pod {
    height: 42px; display: flex; align-items: center; gap: 2px; padding: 0 6px;
    border: 1px solid var(--line); border-radius: 12px;
    background: var(--glass); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    pointer-events: auto; white-space: nowrap;
  }
  .pod-run > .pod:first-child { border-radius: 21px 12px 12px 21px; }
  .pod-run > .pod:last-child { border-radius: 12px 21px 21px 12px; }
  .pod-run > .pod:only-child { border-radius: 21px; }
  .pod-run .icon-button { opacity: .4; }
  .pod-run:hover .icon-button, .pod-run:focus-within .icon-button { opacity: 1; }

  .icon-button {
    position: relative; display: grid; place-items: center;
    width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    transition: opacity 250ms ease, color 140ms ease, background 140ms ease,
      transform 140ms ease;
  }
  .icon-button:hover, .icon-button:focus-visible {
    outline: none; background: rgba(255,255,255,.12);
  }
  .pod-run .icon-button:disabled,
  .pod-run:hover .icon-button:disabled { opacity: .16; cursor: default; }
  .icon-button:disabled:hover { background: transparent; }
  .icon-button svg {
    width: 19px; height: 19px; fill: none; stroke: currentColor;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .control-label {
    position: absolute; top: auto; bottom: calc(100% + 10px); left: 50%;
    transform: translate(-50%, 3px); padding: 3px 7px; border-radius: 6px;
    background: var(--glass-light); color: var(--ink);
    box-shadow: 0 7px 20px rgba(0,0,0,.2);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 10px; font-weight: 650; letter-spacing: .025em;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 120ms ease, transform 120ms ease, visibility 120ms;
  }
  .icon-button:hover .control-label, .icon-button:focus-visible .control-label {
    opacity: 1; visibility: visible; transform: translate(-50%, 0);
  }
  .icon-button:disabled .control-label { display: none; }

  /* ---- the presenter's bar (copied subset of the viewer's) ---- */
  #navbar {
    position: fixed; z-index: 18; left: 0; right: 0; bottom: 12px;
    display: flex; justify-content: center; align-items: center;
    gap: 5px; padding: 0 14px; pointer-events: none;
  }
  #navbar > * { position: relative; }
  #navbar > *:hover, #navbar > *:focus-within { z-index: 20; }
  .transport-pod { padding: 0 5px; }
  .rail-pod { flex: 0 1 auto; min-width: 0; padding: 0 6px; }
  .view-pod { padding: 0 5px; }

  #position {
    min-width: 54px; padding: 0 8px; text-align: center; color: var(--dim);
    font-size: 11px; letter-spacing: .045em; text-transform: uppercase;
  }
  #position strong { color: var(--text); font-weight: 550; }
  #position-total { color: var(--dim); }

  .fs-exit { display: none; }
  body.fullscreen .fs-enter { display: none; }
  body.fullscreen .fs-exit { display: block; }

  /* ---- the rail (copied from the viewer, verbatim) ---- */
  #rail {
    position: relative; flex: 0 1 auto; min-width: 80px; height: 26px;
    width: clamp(240px, calc(var(--marks, 2) * 26px), 640px); cursor: pointer;
  }
  .rail-span { position: absolute; inset: 0 9px; }
  /* A press dragged along a recording's rail scrubs it (rail.js). */
  #rail.scrubbing { cursor: ew-resize; }
  .rail-track {
    position: absolute; left: 0; right: 0; top: 50%; height: 1px; margin-top: -0.5px;
    background: rgba(255, 255, 255, 0.14);
  }
  /* The band: the stretch in question. At rest it is Plass's band at rest
     (white 3.5 % over an 8 % edge) over the stretch the next arrow plays;
     while a move crosses a stretch, that one, lit in the accent. It says
     which stretch and, live, not how far along: the animation is on
     screen at full size (a recording's head rides it; below). */
  .rail-band {
    position: absolute; top: 50%; height: 12px; margin-top: -6px;
    left: calc(var(--a, 0) * 100% - 4px);
    width: calc((var(--b, 0) - var(--a, 0)) * 100% + 8px);
    border-radius: 4px; pointer-events: none;
    background: rgba(255, 255, 255, 0.035);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    transition: left 280ms ease, width 280ms ease, background 200ms ease,
      box-shadow 200ms ease, opacity 200ms ease;
  }
  .rail-band.empty { opacity: 0; }
  .rail-band.lit {
    background: rgba(88, 196, 221, 0.14);
    box-shadow: inset 0 0 0 1px rgba(88, 196, 221, 0.5), 0 0 9px rgba(88, 196, 221, 0.25);
  }
  /* The marks: buttons (a tab stop each, Return jumps) placed by --f. They
     take no pointer events: the rail takes the nearest within 8 px
     (rail.js), and that one grows and whitens, as on Plass's rail. */
  .mark {
    position: absolute; top: 50%; left: calc(var(--f, 0) * 100%);
    width: 5px; height: 5px; padding: 0; border: 0; border-radius: 50%;
    background: rgba(240, 238, 233, 0.72);
    transform: translate(-50%, -50%); pointer-events: none;
    transition: left 280ms ease, transform 120ms ease, background 120ms ease,
      box-shadow 200ms ease;
  }
  .mark.future { background: rgba(150, 145, 153, 0.5); }
  /* A unit that may hold several pausepoints until it runs (a loop, a
     branch): a fainter dot behind it, so the rail does not claim a count
     it does not have. */
  .mark.many { box-shadow: 4px 0 0 -0.5px rgba(150, 145, 153, 0.32); }
  .mark.start, .mark.end {
    width: 1.5px; height: 11px; border-radius: 1px; background: rgba(240, 238, 233, 0.6);
  }
  .mark.end.future { background: rgba(150, 145, 153, 0.5); }
  .mark.current { background: var(--accent); box-shadow: 0 0 6px rgba(88,196,221,.55); }
  .mark.hot { background: #fff; transform: translate(-50%, -50%) scale(1.45); }
  .mark.current.hot { background: var(--accent); }
  .mark:focus { outline: none; }
  .mark:focus-visible { box-shadow: 0 0 0 1.5px var(--frame), 0 0 0 3px #9db8d6; }
  /* While a move crosses a stretch the position is the stretch, not the
     pausepoint being left: the accent leaves its mark and the lit band is
     the whole story; the destination lights on arrival. A scrub likewise:
     the head under the pointer is the position until the release. */
  body.moving #rail .mark.current, #rail.scrubbing .mark.current {
    background: rgba(240, 238, 233, 0.72); box-shadow: none; }
  body.moving #rail .mark.start.current, #rail.scrubbing .mark.start.current,
  body.moving #rail .mark.end.current, #rail.scrubbing .mark.end.current {
    background: rgba(240, 238, 233, 0.6); }
  .tick {
    position: absolute; top: 50%; left: calc(var(--f, 0) * 100%);
    width: 1px; height: 5px; margin: -2.5px 0 0 -0.5px;
    background: rgba(240, 238, 233, 0.24); pointer-events: none;
    transition: left 280ms ease;
  }
  /* The head: the position where no pausepoint stands for it, parked on a
     play (UP/DOWN) or a recording crossing a stretch, where it rides the
     video's clock. Knuth's caret bar in the accent, upright. */
  .rail-head {
    position: absolute; top: 50%; left: calc(var(--f, 0) * 100%);
    width: 2px; height: 12px; margin: -6px 0 0 -1px; border-radius: 1px;
    background: var(--accent); box-shadow: 0 0 6px rgba(88,196,221,.55);
    pointer-events: none;
  }
  .rail-head.off { opacity: 0; }

  /* ---- the preview card (copied from the viewer) ---- */
  .rail-preview {
    position: fixed; z-index: 40; width: 200px; padding: 5px 5px 6px;
    border: 1px solid var(--line-strong); border-radius: 8px;
    background: var(--glass-solid); box-shadow: 0 11px 32px rgba(0, 0, 0, 0.28);
    pointer-events: none; opacity: 0; visibility: hidden; transform: translateY(3px);
    transition: opacity 120ms ease, transform 120ms ease, visibility 120ms;
  }
  .rail-preview.shown { opacity: 1; visibility: visible; transform: none; }
  .rail-preview-frame {
    aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden;
    border: 1px dashed var(--line-strong); background: #000;
  }
  .rail-preview-frame.has-still { border-style: solid; }
  .rail-preview-frame > * { display: block; width: 100%; height: 100%; object-fit: contain; }
  .rail-preview-title {
    margin: 6px 2px 0; color: var(--text); font-size: 12px; font-weight: 550;
    line-height: 1.3; white-space: normal; overflow-wrap: anywhere;
  }
  .rail-preview-detail {
    margin: 3px 2px 0; color: var(--dim); font-size: 10.5px; line-height: 1.35;
    white-space: normal;
  }

  @media (max-width: 620px) {
    #navbar { gap: 4px; padding-inline: 7px; }
    #position { min-width: 54px; padding-inline: 3px; }
  }
</style>
</head>
<body>
<div id="stage"><video id="video" src="scene.mp4" preload="auto" playsinline></video></div>

<div id="navbar" class="pod-run" aria-label="Presentation controls">
  <div class="pod transport-pod">
    <button id="start" class="icon-button" aria-label="Jump to the start" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6v12"/><path d="m16.5 6-6 6 6 6"/></svg><span class="control-label">Start&nbsp; Home</span>
    </button>
    <button id="previous" class="icon-button" aria-label="Play previous animation in reverse" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg><span class="control-label">Back&nbsp; &larr;</span>
    </button>
    <div id="position"><strong id="position-now">1</strong><span id="position-total"> / &mdash;</span></div>
    <button id="next" class="icon-button" aria-label="Play next animation" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6"/></svg><span class="control-label">Next&nbsp; &rarr;</span>
    </button>
  </div>

  <div class="pod rail-pod">
    <div id="rail" role="list" aria-label="Scene pausepoints"></div>
  </div>

  <div class="pod view-pod">
    <button id="fullscreen" class="icon-button" aria-label="Full screen" aria-pressed="false">
      <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>
      <span class="control-label">Full screen&nbsp; F</span>
    </button>
  </div>
</div>

<script src="presentation.js"></script>
<script src="rail.js"></script>
<script src="present_meta.js"></script>
<script>
"use strict";
(() => {
  const meta = window.MANIML_PRESENT;
  const video = document.getElementById("video");
  const stage = document.getElementById("stage");

  document.title = meta.scene;

  // The same bridge the viewer uses in playback mode: presentation.js
  // scrubs the video, the rail's presenter narrates the moves.
  function synthState(index) {
    const cps = meta.checkpoints;
    return {
      current: index, count: cps.length,
      lines: cps.map((c) => c.line),
      units: cps.map((c) => c.chip_unit),
      times: cps.map((c) => c.time),
      stops: cps.map((c) => !!c.stop),
      names: cps.map((c) => c.name || null),
      future: [],
    };
  }

  const rail = ManimlRail.create({
    document,
    railEl: document.getElementById("rail"),
    body: document.body,
    raf: (fn) => requestAnimationFrame(fn),
    env: () => {},
    onChipClick: (index) => ManimlPresentation.seekCheckpoint(index),
    onFutureChipClick: () => {},   // a baked table has no future units
    // The recording can be scrubbed with the mouse (rail.js, Scrubbing).
    scrub: {
      enabled: () => true,
      to: (time) => ManimlPresentation.scrubTo(time),
      end: (time) => ManimlPresentation.scrubEnd(time),
    },
  });
  const presenter = rail.presenter;
  // Hovering a pausepoint: its frame from the recording, its name, its line.
  const stills = ManimlRail.videoStills(document, "scene.mp4", meta, 384);
  ManimlRail.attachPreview(rail, {
    document,
    railEl: document.getElementById("rail"),
    still: (info) => stills.get(info.index),
  });

  ManimlPresentation.load(video, meta, {
    onUpdate: (index) => presenter.stateChanged(synthState(index)),
    onMove: (from, to, back, unit) => {
      if (from !== null && from !== undefined) {
        presenter.moveStarted(from, to, back, unit);
      }
    },
    onRest: (index) => presenter.moveEnded(synthState(index)),
    onTime: (time) => presenter.time(time),
  });
  new ResizeObserver(() => rail.relayout()).observe(document.getElementById("rail"));

  document.getElementById("start").onclick =
    () => ManimlPresentation.seekCheckpoint(0);
  document.getElementById("previous").onclick =
    () => ManimlPresentation.playToPreviousStop();
  document.getElementById("next").onclick =
    () => ManimlPresentation.playToNextStop();

  const fullscreenButton = document.getElementById("fullscreen");
  fullscreenButton.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  };
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    document.body.classList.toggle("fullscreen", on);
    fullscreenButton.setAttribute("aria-pressed", String(on));
  });

  // Click / tap: the left fifth steps back, the rest advances — the
  // slide-clicker model, workable one-handed on a phone.
  stage.addEventListener("click", (e) => {
    const back = e.clientX < stage.clientWidth / 5;
    if (back) ManimlPresentation.playToPreviousStop();
    else ManimlPresentation.playToNextStop();
  });

  document.addEventListener("keydown", (e) => {
    const forward = ["ArrowRight", " ", "Enter", "PageDown"];
    const backward = ["ArrowLeft", "PageUp"];
    if (forward.includes(e.key)) {
      e.preventDefault();
      ManimlPresentation.playToNextStop();
    } else if (backward.includes(e.key)) {
      e.preventDefault();
      ManimlPresentation.playToPreviousStop();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      ManimlPresentation.stepCheckpoint(1);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      ManimlPresentation.stepCheckpoint(-1);
    } else if (e.key === "Home") {
      e.preventDefault();
      ManimlPresentation.seekCheckpoint(0);
    } else if (e.key === "End") {
      e.preventDefault();
      ManimlPresentation.seekCheckpoint(
        meta.checkpoints[meta.checkpoints.length - 1].index);
    } else if (e.key === "f" || e.key === "F") {
      e.preventDefault();
      fullscreenButton.onclick();
    }
  });

  presenter.stateChanged(synthState(0));
})();
</script>
</body>
</html>
