<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>maniml scene</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101014; --panel: #17171c; --line: #26262e;
    --text: #d6d6dc; --dim: #74747e; --accent: #58C4DD;
  }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0 0 48px 0;
    display: flex; align-items: center; justify-content: center;
    padding: 10px; box-sizing: border-box;
  }
  #stage canvas { max-width: 100%; max-height: 100%; border-radius: 6px; }
  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 48px;
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    box-sizing: border-box; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  #scene-name { font-weight: 600; white-space: nowrap; }
  #playbtn {
    border: 1px solid var(--line); border-radius: 6px; background: none;
    color: var(--text); font: inherit; padding: 3px 12px; cursor: pointer;
  }
  #playbtn:hover { border-color: var(--accent); color: var(--accent); }
  #chips {
    display: flex; align-items: center; gap: 7px;
    overflow-x: auto; padding: 4px 0;
  }
  .chip {
    width: 12px; height: 12px; border-radius: 50%; flex: none;
    background: var(--line); border: 1px solid #3a3a44; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.current { background: var(--accent); border-color: var(--accent); }
  #status { margin-left: auto; color: var(--dim); font-size: 12px; }
  #renderer-error {
    max-width: 440px; padding: 20px 24px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--panel); text-align: center;
    color: var(--text); line-height: 1.55;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <div id="scene-name"></div>
  <button id="playbtn" title="play / pause (space)">▶</button>
  <div id="chips"></div>
  <div id="status"></div>
</div>
<script src="webgpu.js"></script>
<script src="player.js"></script>
</body>
</html>
