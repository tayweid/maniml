[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maniml"
version = "0.0.1"
description = "Animation engine for explanatory math videos with OpenGL renderer"
readme = "README.md"
authors = [
    {name = "maniml Contributors"},
]
license = "MIT"
license-files = ["LICENSE", "LICENSE.community"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["animation", "mathematics", "manim", "visualization", "education"]
requires-python = ">=3.11"
dependencies = [
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "numpy>=1.19.0",
    "moderngl>=5.6.0",
    "moderngl-window>=2.4.0",
    "pillow>=8.0.0",
    "pydub>=0.25.1",
    "scipy>=1.5.0",
    "colour>=0.1.5",
    "pygments>=2.6.0",
    "PyYAML>=5.3.0",
    "addict>=2.4.0",
    "PyOpenGL>=3.1.0",
    "validators>=0.18.0",
    "screeninfo>=0.6.0",
    "appdirs>=1.4.0",
    "matplotlib>=3.0.0",
    "mapbox-earcut>=1.0.0",
    "svgelements>=1.0.0",
    "isosurfaces>=0.1.0",
    "manimpango>=0.4.0",
    "tqdm>=4.0.0",
    "pyglet>=2.0.0",
    # maniml uses the new websockets.asyncio implementation added in 13.0.
    "websockets>=13.0",
    "rich>=13.0.0",
    "fonttools>=4.0.0",
]

[project.optional-dependencies]
# The wgpu-py reference renderer (tests / future native backend);
# the browser's WebGPU needs nothing installed
webgpu = [
    "wgpu>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=5.0.0",
    "mypy>=1.10.0",
    "isort>=5.10.0",
    "twine>=5.1.0",
]

[tool.uv]
required-version = ">=0.12.5,<0.13.0"

[project.urls]
Homepage = "https://github.com/tayweid/maniml"
Documentation = "https://github.com/tayweid/maniml"
Repository = "https://github.com/tayweid/maniml.git"
"Bug Tracker" = "https://github.com/tayweid/maniml/issues"
Changelog = "https://github.com/tayweid/maniml/blob/main/CHANGELOG.md"

[project.scripts]
maniml = "maniml.__main__:main"

[tool.setuptools.packages.find]
include = ["maniml*"]  # never ship tests/ or example_scenes/

[tool.setuptools.package-data]
maniml = [
    "*.yml",
    "rendering/shaders/*.glsl",
    "rendering/shaders/**/*.glsl",
    "web/static/*.html",
    "web/static/*.js",
    "web/static/*.webmanifest",
    "web/static/icons/*",
    "web/static/glsl/*",
    "web/static/wgsl/*",
]

[tool.black]
line-length = 88
target-version = ['py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "moderngl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true
